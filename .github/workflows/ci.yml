# Simulator-only test suite on the development OS (macOS) and the lab OS (Windows); blueprint 7 and 8.1.
# Hardware and harness-acceptance tests never run here.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - name: Install (uv.lock, frozen)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check
      - name: Tests (simulator only)
        run: uv run pytest -q -m "not hardware and not acceptance"
