# Bring-up steps in execution order (v2.1 plan §4.1; schema StepsFile in src/b1500_test_agent/models/validation.py).
# `uv run b1500 bringup next` shows the next step, `uv run b1500 bringup done STEP ...` verifies and records it in the
# step ledger (data/state/bringup/ledger-<backend>.jsonl, written only by the CLI), `uv run b1500 bringup check`
# re-verifies the ledger. Stage steps are the numbered items of the stage files (L1.P1 = physical step 1, L1.A4 = agent
# step 4) plus one review step <stage>.R; their text is the stage file's. `uv run b1500 dev lint-skills` keeps this file
# and the stage files in step (every numbered item exactly once, recipes, check ids, runbooks).
#
# Fields: who (agent | human | both), verify (how `done` checks it on hardware), rehearsal (how the simulator ledger
# takes it: run_sim = verified the same way, refusal = records and fixtures are refused on the simulator by design,
# human_done = the human's own "done", skip = lab only), recipes (runs it takes; optional = not required), outcomes (run
# outcomes it accepts; default completed or completed_with_flags), keys (--observe keys it needs), config (items it
# adopts or proposes), must_pass (doctor lines), feeds (stage check ids), on_fail (b1500-debug runbooks), reconfirm
# (asked again after a break), after_record (follows the drafting of the stage record, which cannot list it), items /
# atv (blueprint v2 7.6 items and ATVs it settles).
#
# v2.1 (WP21.6) added the gap steps of plan §4.6: ASU/SCUU presence (L0.P2), capture steps (L2.A10, L3.A6, L5.A9,
# L6.A8, L7.A13, L8.A11), the two-wire contact resistance (L2.P5, L2.A8), log sampling (L5.A7), the second probe after
# the corrections (L6.A3), the read window (L7.A7), the ERSSP? negative control (L7.P7, L7.A11, L7.P8, L7.A12), the
# relay settle and pulse edges by scope (L7.A4), ATV-17 (L8.P5, L8.A7), the PUND ramp series (L8.A8), the timer over
# hours (L9.A11), the correction drift (L9.P9, L9.A12) and the session end during an async run (L10.P1, L10.A2).
version: 1

# Session 0 on the lab PC = docs/deployment-windows.md "First session" D1-D12. The clone does not exist before D6 and
# the harness not before D10: record D1-D10 afterwards (the human may run `uv run b1500 bringup done` in their own
# terminal). On the lab PC the human creates config/local with backend visa at D7, before the first `done`: from then
# on every step lands in the hardware ledger (a simulator ledger never signs a hardware stage).
deployment:
  - {id: D1, who: human, verify: confirm, rehearsal: human_done,
     text: "Git for Windows, uv (`winget install astral-sh.uv`) and Python 3.12 (`uv python install 3.12`) installed (deployment step 1)."}
  - {id: D2, who: human, verify: confirm, rehearsal: skip, items: [1],
     text: "Lab IT installed the Keysight IO Libraries Suite (the VISA stack) and the GPIB adapter's driver (step 1)."}
  - {id: D3, who: human, verify: confirm, rehearsal: skip, items: [5], atv: [ATV-15],
     text: "Lab IT installed the B1530A WGFMU Instrument Library A.03.00 or later: the x64 `wgfmu.dll` in C:\\Windows\\System32 (step 1)."}
  - {id: D4, who: human, verify: confirm, rehearsal: human_done,
     text: "Harness CLIs by their one install method each, signed in: Node.js LTS and `npm install -g @openai/codex`; Claude Code (optional) by its native installer with auto-update off on the lab PC (`DISABLE_AUTOUPDATER=1` in its user settings) (step 1.6)."}
  - {id: D5, who: human, verify: confirm, rehearsal: skip,
     text: "`setx PYTHONUTF8 1`, then a new PowerShell window (step 1)."}
  - {id: D6, who: human, verify: confirm, rehearsal: human_done,
     text: "The clone (`git clone REMOTE_URL C:\\b1500\\test_agent`) and the manual PDFs in the clone's parent or `B1500_MANUALS_DIR` (step 2)."}
  - {id: D7, who: both, verify: doctor, rehearsal: run_sim,
     text: "`uv sync --frozen`; `uv run b1500 manual status`; on the lab PC the human runs `uv run b1500 config init --visa` now (it writes config/local only, no instrument contact; stage L0 checks it); then `uv run b1500 doctor` without FAIL (steps 3, 5)."}
  - {id: D8, who: human, verify: doctor, rehearsal: run_sim, must_pass: [harness files],
     text: "`uv run b1500 harness init --codex` (and `--claude` for Claude Code): the generated harness configuration, checked by `uv run b1500 doctor` (step 7)."}
  - {id: D9, who: human, verify: observation, rehearsal: human_done, keys: [trusted, sandbox],
     text: "Start each harness in the clone once and accept its trust question; `codex doctor --summary` shows the restricted sandbox (`--observe trusted=<harnesses> --observe sandbox=<the sandbox row>`) (steps 8.1-8.2, 9.2)."}
  - {id: D10, who: human, verify: observation, rehearsal: skip, keys: [update, qualify_windows], items: [12], atv: [ATV-33, ATV-38, ATV-39, ATV-40],
     text: "`uv run b1500 update` in your own terminal ends with `Ready.`; then the maintainer's `uv run b1500 dev harness qualify --windows` once (T0, T1 and S16; writes data/state/harness/windows.json) (steps 8, 12)."}
  - {id: D11, who: human, verify: observation, rehearsal: human_done, keys: [approval_prompt, hooks_listed], items: [12], atv: [ATV-7, ATV-8, ATV-11],
     text: "Interactive checks (steps 8.5, 9.4-9.5): the approval prompt of `run_confirmed_plan` shows the summary (or `approval_prompt=at L4` when no L1 files exist yet); Claude Code's `/hooks` lists the guard hook."}
  - {id: D12, who: human, verify: observation, rehearsal: skip, keys: [versions, wgfmu_library, install_route], items: [5, 12], atv: [ATV-15],
     text: "The deployment's Recorded results: harness, uv, Git, Python and Node.js versions; WGFMU library version and DLL path; install route (PyPI or wheelhouse, with the commit it was built from)."}

# Start of every session after session 0 (a new session begins after the end steps or after a 12 h break).
session_start:
  - {id: R1, who: agent, verify: doctor, rehearsal: run_sim, must_pass: [harness versions],
     text: "`uv run b1500 doctor`: no FAIL and `harness versions` PASS (else the human runs `uv run b1500 update` first)."}
  - {id: R2, who: agent, verify: station, rehearsal: run_sim,
     text: "`station_status` clean: no fault latched, no lock holder, no running run."}
  - {id: R3, who: human, verify: confirm, rehearsal: human_done, items: [4],
     text: "The human: EasyEXPERT exited (Start EasyEXPERT button shown), today's interlock test passed, shield box and DUT in the state the ledger expects."}
  - {id: R4, who: agent, verify: observation, rehearsal: run_sim, keys: [reconfirm],
     text: "`uv run b1500 bringup next`: tell the human which steps of the stage are asked again after the break (`--observe reconfirm=<step ids or none>`)."}

# End of every session.
session_end:
  - {id: E1, who: agent, verify: station, rehearsal: run_sim,
     text: "`safe_shutdown(\"end of session\")`, then `station_status` clean."}
  - {id: E2, who: human, verify: hw_suite, rehearsal: skip,
     text: "The human: `$env:B1500_HW = \"1\"; uv run pytest -m \"hardware and hw_<stage>\" -rs --junitxml work\\bringup\\hw-<UTC>.xml` for the stages touched; nothing skipped by the gate (`--draft` the JUnit file)."}
  - {id: E3, who: agent, verify: ledger, rehearsal: run_sim,
     text: "`uv run b1500 bringup check`: every step recorded so far still verifies."}
  - {id: E4, who: human, verify: confirm, rehearsal: skip,
     text: "The human backs up data\\runs\\ and config\\local\\ (deployment step 11)."}
  - {id: E5, who: human, verify: confirm, rehearsal: skip,
     text: "The human reviews the drafts of finished stages (`<stage>.R`) and transfers records and fixtures (v2 OD-7)."}

