[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b1500-test-agent"
version = "0.1.0"
description = "Safety-gated Keysight B1500A measurement kernel with a 10-tool MCP server, CLI and agent skills."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
  { name = "bcacdwk", email = "17078434@qq.com" }
]
dependencies = [
  "fastmcp>=4,<5",
  "filelock",
  "matplotlib",
  "numpy",
  "pandas",
  "pydantic>=2",
  "pypdfium2>=5.15.2",
  "pyvisa",
  "pyyaml",
  "typer",
]

[project.scripts]
b1500 = "b1500_test_agent.adapters.cli:main"
b1500-mcp = "b1500_test_agent.adapters.mcp_server:main"

[dependency-groups]
# `uv sync` installs the `dev` group by default.
dev = [
  "hypothesis",
  "pytest",
  "pytest-xdist",
  "pyvisa-sim",
  "ruff",
  "tiktoken",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Ruff's default rule set (pinned through uv.lock) plus line length.
extend-select = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "hardware: needs a real B1500A over VISA; skipped unless B1500_HW=1 and backend visa (M4, owner present)",
  "acceptance: M3 harness acceptance scenarios (Codex / Claude Code); run explicitly",
  "manuals: manual corpus, search and citation lint (blueprint 5; fixtures, no PDF needed)",
]
