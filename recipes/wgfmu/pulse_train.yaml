# Recipe (registry source; schema b1500_test_agent.models.recipe.Recipe; checked by `b1500 dev recipe-check`).
# WGFMU pulse train (blueprint v2 3.4, kind wgfmu_waveform, builder pulse_train; WG Ex. 1-3): `count` identical gate
# pulses (WGFMU, Fast IV: base -> peak in `edge`, flat top `width`, back, rest of the `period` at base; one pattern
# repeated by the sequence count, never free-running) while the drain (WGFMU, Fast IV, current on `irange`) holds vd
# and takes `samples` contiguous averaged points on each flat top (minus `settle` at both ends). The table's cycle
# column is the pulse number: pulse_plateau gives each pulse's plateau current (drift over the train). The gate
# terminal needs a pulse envelope (R-PULSE-02); above the policy's soft bands (count, on-time, duty) it confirms
# (soft_pulse). gate_mode pg (WP11.2) pulses the gate in the WGFMU's PG mode instead (ALWG voltage output through the
# internal 50 Ohm, -5..5 V open load, no current measurement on the gate; WG p16 (1-4)): the set level is the open-load
# level, so the insulated gate sees it, a resistive load less.
# status: sim_validated by tests/integration/test_recipes_wgfmu.py (nmos_wgfmu: every pulse's plateau current = the
# model's Id at the peak +-2 %, count and timing exact on the 10 ns grid).
id: wgfmu.pulse_train
version: 1
title: WGFMU pulse train (gate pulses, drain bias, Id sampled on every pulse plateau)
family: wgfmu
kind: wgfmu_waveform
status: sim_validated
card: .agents/skills/b1500-test/cards/wgfmu/wgfmu-pulsed-iv.md
device_types: [nmos, pmos, igzo_tft, fefet]
roles:
  gate:
    function: wgfmu
    module_types: [WGFMU]
    settings: {base: $vg_base, peak: $vg_peak, mode: $gate_mode}
  drain:
    function: wgfmu
    measure: [I]
    module_types: [WGFMU]
    settings: {v: $vd, range: $irange}
  source: {function: ground, allow_gndu: true}
params:
  builder: {type: enum, choices: [pulse_train], default: pulse_train, doc: Fixed waveform builder.}
  vg_base: {unit: V, default: 0.0, recommended: [-1.0, 0.0], range: [-5.0, 5.0], doc: Gate level between pulses.}
  vg_peak: {unit: V, default: 2.0, recommended: [1.0, 3.0], range: [-5.0, 5.0], doc: Gate pulse level.}
  vd: {unit: V, default: 1.0, recommended: [0.05, 2.0], range: [-5.0, 5.0], doc: Drain bias held during the run.}
  irange: {type: enum, choices: [1ua, 10ua, 100ua, 1ma, 10ma], default: 1ma, doc: Drain current range (full scale).}
  width: {unit: s, default: 1.0e-5, recommended: [1.0e-6, 1.0e-4], range: [1.0e-7, 1.0e-2], doc: Flat top of each pulse.}
  period: {unit: s, default: 1.0e-4, recommended: [1.0e-5, 1.0e-2], range: [1.0e-6, 1.0], doc: "Pulse period (> width + 2 edge)."}
  edge: {unit: s, default: 1.0e-7, recommended: [1.0e-8, 1.0e-6], range: [1.0e-8, 1.0e-4], doc: Rise and fall time.}
  settle: {unit: s, default: 1.0e-6, recommended: [1.0e-7, 1.0e-5], range: [0.0, 1.0e-3], doc: Time from each edge to the sampled window.}
  count: {type: int, default: 100, recommended: [1, 10000], range: [1, 1000000], doc: Pulses of the train (sequence count).}
  samples: {type: int, default: 10, recommended: [1, 100], range: [1, 2000], doc: Contiguous averaged points on each flat top.}
  gate_mode: {type: enum, choices: [fastiv, pg], default: fastiv,
              doc: "Gate channel operation mode: fastiv (Fast IV) or pg (PG mode, 50 Ohm output, open-load level, 5 V ranges)."}
quality: {limited: [C, T], untrusted: [V, X, F, D, G, S, U], max_limited_fraction_in_fit: 0.05}
analysis_defaults:
  - {method: pulse_plateau, options: {x: gate_V, y: drain_I}}
provenance:
  sources:
    - blueprint v2 2.7.1 (builder pulse_train), 3.4 (wgfmu.pulse_train)
    - WGFMU guide Ed. 8 Examples 1-3 (PDF 46-55), addSequence (PDF 80), setMeasureEvent (PDF 125-126)
  validation_runs: []
