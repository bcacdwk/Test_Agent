# Simulator scenario (committed). Schema: b1500_test_agent.models.station.SimScenario. Name = file name.
# The lab mainframe of blueprint v2 1.1 / 7.3 for bring-up rehearsals (skill b1500-bringup, stage L0 on the
# simulator; acceptance S17): the identity and module inventory the lab's own records show, and no DUT (probes
# lifted, nothing wired), so every terminal reads open. Evidence: *IDN? from the headers of
# lwp/matlab_B1500/IdVg_test_*.csv (model and firmware only; the serial field reads 0, PG p440 (4-122)); slots from
# lwp/matlab_B1500/B1500_Config.mat (UNT? 0: SPGU1=1, WGFMU1=2, HRSMU1=3, HRSMU2=4, MPSMU1=5, MPSMU2=6, CMU1=7);
# slots 8-10 were not recorded (left empty here). The B1511B of slots 5/6 is the station example's guess
# (B1511A or B: confirmed at L0). The two 16440A selectors (WP9.2) are cabled as in fefet_lab.yaml; nothing hangs on
# their outputs. Noise, faults and timing as documented in nmos_basic.yaml.

description: >-
  The lab mainframe (B1525A SPGU, B1530A WGFMU, 2 B1517A HRSMU, 2 B1511B MPSMU, B1520A MFCMU) with no DUT wired, for
  bring-up rehearsals (read-only probe, station proposal, configuration adoption); instant timing.
idn: Agilent Technologies,B1500A,0,A.06.02.2023.0401
slots:                          # lab layout (config/station.example.yaml): SPGU 1, WGFMU 2, HRSMU 3-4, MPSMU 5-6, MFCMU 7
  - {slot: 1, model: B1525A}
  - {slot: 2, model: B1530A}
  - {slot: 3, model: B1517A}
  - {slot: 4, model: B1517A}
  - {slot: 5, model: B1511B}
  - {slot: 6, model: B1511B}
  - {slot: 7, model: B1520A}
interlock_closed: false
selectors:                      # 16440A cabling (rehearsal assumption; the real wiring is recorded at bring-up L7):
  0: {smu: 3, pgu: 101}         # ERSSP port -> SMU Force on the SMU input, SPGU channel on the PGU input; lwp
  1: {smu: null, pgu: 102}      # SPGU_pulse.m drives all four ports (ERMOD 1, ERSSP 0..3), so both selectors are
  2: {smu: 5, pgu: null}        # simulated; no DUT hangs on their outputs here (system.selector_check steps them)
  3: {smu: 6, pgu: null}
wiring: {}                      # no DUT: probes lifted
models: {}
noise:
  floor_a: {MPSMU: 1.0e-11, HRSMU: 1.0e-13}
  rel: 1.0e-3
  seed: 3
faults: null
timing: instant
