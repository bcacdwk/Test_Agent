# DUT profile (example; committed). Schema: b1500_test_agent.models.policy.DutProfile; name = file name.
# Generic gate dielectric (5 nm SiO2-like film, 100 um x 100 um MOS gate stack on a capacitor or transistor landing,
# pin map mosfet-4t: gate, drain, source, bulk) for time-dependent dielectric breakdown; example values, not a real
# device. The gate envelope allows constant-voltage stress up to the nominal breakdown voltage because TDDB is meant
# to destroy the structure (every TDDB plan is confirmed as destructive); a human sets it per film from a breakdown
# ramp on a sacrificial site. Source, drain and bulk are only grounded (0 V, the stress current returns there).
# Nominal values: simulator example (scenario `dielectric_tddb`), not a real-device value and never a measurement.

device_type: dielectric
description: Generic gate dielectric (5 nm, 1e4 um^2) for TDDB stress (example envelope).
terminals:
  gate:
    max_abs_v: 6.0              # = the nominal bdv below; stress levels stay below it
    max_abs_i: 1.0e-2           # largest stress compliance (the post-breakdown current limit)
    impedance: high_z
  bulk:   {max_abs_v: 1.0, max_abs_i: 1.0e-2}
  source: {max_abs_v: 1.0, max_abs_i: 1.0e-2}
  drain:  {max_abs_v: 1.0, max_abs_i: 1.0e-2}
geometry: {area_um2: 10000.0, tox_nm: 5.0}
nominal:
  # 6 V = 12 MV/cm x 5 nm: a breakdown field of the textbook order for thermal SiO2 and the simulator's value
  # (scenario `dielectric_tddb`), not your film (ramp a sacrificial site with dielectric.bdv).
  bdv: {value: 6.0, unit: V}
notes:
  - "TDDB stress levels: from the request or the DUT profile, else ask the human (the lab's practice is asked in
    knowledge 05). They stay below the ramp BDV of a sacrificial site of the same film and are chosen so t_bd falls
    inside the run time; a starting fraction of the BDV needs a checked source (TODO(cite))."
  - "Leakage before breakdown: unknown for your film; measure it on a sacrificial site first (reliability.silc
    reference read or mosfet.gate_leakage)."
