# Simulator scenario (committed). Schema: b1500_test_agent.models.station.SimScenario; device params are typed by
# b1500_test_agent.models.sim (DEVICE_PARAMS); consumed by the simulator (transport/sim/). Name = file name. The
# slots mirror config/station.example.yaml; `wiring` is the physical wiring of the simulated prober (independent of
# the agent's pin map); `models` holds the truth parameters tests compare extractions against; noise, faults and
# timing as documented in nmos_basic.yaml.

description: n-channel FeFET wired like pin map mosfet-4t (gate SMU1, drain SMU3, source/bulk GNDU); instant timing.
idn: Keysight Technologies,B1500A,SIM0000001,A.06.01.2024.0101
slots:
  - {slot: 1, model: B1511B}
  - {slot: 2, model: B1511B}
  - {slot: 3, model: B1517A}
  - {slot: 4, model: B1517A}
  - {slot: 5, model: B1530A}
  - {slot: 6, model: B1525A}
  - {slot: 7, model: B1520A}
interlock_closed: false
wiring:
  dut:
    gate: 1
    drain: 3
    source: GNDU
    bulk: GNDU
models:
  dut:
    model: fefet
    params:
      polarity: n
      vth0: 0.6                 # V; threshold at zero polarization (Vth = vth0 - k_v * P)
      k_v: 0.5                  # V; a saturated loop gives a memory window of about 2 * k_v = 1 V
      vc_v: 2.8                 # V; coercive gate voltage (switching at +2.8 V up, -2.8 V down)
      delta_v: 0.45             # V; width of the tanh switching branches (a +-4 V sweep saturates to |P| > 0.99)
      p_init: -1.0              # erased (high-Vth) state until the first program; persisted in the sim state
      slope_factor: 1.3
      beta: 1.0e-3              # A/V^2
      theta: 0.5                # 1/V; strong mobility degradation keeps the max-gm point below the switching
      lambda: 0.05
      rs_ohm: 20.0
      gate_leak_s: 1.0e-12
      temperature_k: 300.0
noise:
  floor_a: {MPSMU: 1.0e-11, HRSMU: 1.0e-13}
  rel: 1.0e-3
  seed: 3
faults: null
timing: instant
