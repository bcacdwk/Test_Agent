# Recipe (registry source; schema b1500_test_agent.models.recipe.Recipe; checked by `b1500 dev recipe-check`).
# FeFET memory window from program/erase pulses (card nvm/fefet-pulse-write-read, bring-up stage L7; blueprint v2 3.3,
# implements the reserved id fefet.pulse_write_read): the HV-SPGU pulses the gate through the 16440A selector
# (SEL1.OUT1 -> PGU: v_erase, then v_program, `count` pulses of `width` each; SER = load_ohm, 1 MOhm for the insulated
# gate) and after every operation the selector returns the gate to its SMU (-> SMU) for a read: an Id-Vg sweep at the
# small drain bias vd (read_kind staircase, the default: Vth per read) or spot Id at vg_read (read_kind spot). A
# reference read precedes the first pulse; `cycles` repeats erase/read/program/read; the selector ends at rest
# (verified). Kind pulse_read (HV-SPGU source): routes per phase erase/program (SEL1.OUT1 -> pgu), read (-> smu), rest.
# Read sweeps must stay below the coercive voltage of YOUR device (they must not program the film; Vc from the
# request or the DUT profile, else ask). Default analysis
# memory_window_pulse: MW = Vth(after erase) - Vth(after program) by the constant-current method, per cycle and mean.
# status: sim_validated by tests/integration/test_recipes_pulse_read.py (fefet_lab: MW within 10 % of the model truth
# memory_window_truth(v_program, v_erase, width), routes PGU -> SMU per operation and rest at the end, selector at rest
# verified); hw_validated only through a validation record (stage L7).
id: fefet.pulse_write_read
version: 1
title: FeFET pulse write/read - erase/program pulses through the selector, SMU Id-Vg (or spot) reads, memory window
family: nvm
kind: pulse_read
status: sim_validated
card: .agents/skills/b1500-test/cards/nvm/fefet-pulse-write-read.md
device_types: [fefet]
roles:
  gate:
    function: pgu
    module_types: [HVSPGU]
    settings: {program: $v_program, erase: $v_erase, base: 0.0, width: $width, lead: $t_edge, trail: $t_edge,
               load_ohm: $load_ohm}
  gate_read:
    function: sweep_v
    terminal: gate
    measure: [I]
    module_types: [MPSMU, HRSMU, HPSMU]
    settings: {start: $vg_start, stop: $vg_stop, points: $vg_points, v: $vg_read, icomp: $icomp_gate}
  drain:
    function: bias_v
    measure: [I]
    module_types: [MPSMU, HRSMU, HPSMU]
    prefer: HRSMU
    settings: {v: $vd, icomp: $icomp_drain}
  source: {function: ground, allow_gndu: true}
  bulk: {function: ground, allow_gndu: true, optional: true}
params:
  v_program: {unit: V, default: 4.0, range: [-10.0, 10.0],
              doc: "Program pulse amplitude at the gate (set level; SER-adjusted; n-FeFET: positive, lowers Vth):
                example default for the simulator FeFET (scenario fefet_lab), not a real-device value; your level
                from the request or the DUT profile (a switching-kinetics map of your device), else ask."}
  v_erase: {unit: V, default: -4.0, range: [-10.0, 10.0],
            doc: "Erase pulse amplitude at the gate (n-FeFET: negative, raises Vth): example default (simulator
              FeFET); from the request or the DUT profile, else ask."}
  width: {unit: s, default: 1.0e-6, range: [1.0e-8, 1.0e-3],
          doc: "Pulse width of program and erase (time at the pulse level): example default (simulator FeFET);
            from the request or the DUT profile (a switching-kinetics map), else ask."}
  period: {unit: s, default: 1.0e-5, recommended: [1.0e-6, 1.0e-3], range: [2.0e-8, 1.0],
           doc: "Pulse period (>= width + t_edge / 0.8; matters only with count > 1)."}
  count: {type: int, default: 1, recommended: [1, 10], range: [1, 1000], doc: Pulses per program or erase operation.}
  t_edge: {unit: s, default: 2.0e-8, recommended: [2.0e-8, 1.0e-6], range: [8.0e-9, 0.4],
           doc: "Leading and trailing transition time (width >= t_edge / 0.8, PG p591 (5-19) error 2111)."}
  load_ohm: {unit: Ohm, default: 1.0e+6, recommended: [1.0e+3, 1.0e+6], range: [0.1, 1.0e+6],
             doc: "Declared load SER (1 MOhm for the insulated gate; 50 Ohm doubles the level on an open gate:
             50 Ohm output, UG p76 (2-36))."}
  sequence: {type: enum, choices: [erase_program, program_erase], default: erase_program,
             doc: "Operations of one cycle, each followed by a read."}
  cycles: {type: int, default: 1, recommended: [1, 5], range: [1, 50], doc: Repetitions of the sequence.}
  initial_read: {type: bool, default: true, doc: A reference read before the first pulse.}
  schedule: {type: enum, choices: [cycles], default: cycles, doc: "Schedule (cycles; kinetics, endurance, retention: their own recipes)."}
  read_kind: {type: enum, choices: [staircase, spot], default: staircase,
              doc: "staircase: Id-Vg per read (Vth, MW); spot: Id at vg_read (read current window)."}
  vg_start: {unit: V, default: -0.5, range: [-5.0, 5.0],
             doc: "Read sweep start (below your programmed Vth): example default; from the request or the DUT
              profile, else ask."}
  vg_stop: {unit: V, default: 1.8, range: [-5.0, 5.0],
            doc: "Read sweep stop: must stay below YOUR device's Vc (from the request or the DUT profile; else ask);
              1.8 V suits the simulator FeFET (Vc 2.8 V, scenarios fefet_basic/fefet_lab)."}
  vg_points: {type: int, default: 47, recommended: [31, 101], range: [11, 401], doc: Read sweep points.}
  vg_read: {unit: V, default: 0.6, range: [-5.0, 5.0],
            doc: "Gate level of a spot read (between your two Vth states): example default; from the request or
              the DUT profile, else ask."}
  vd: {unit: V, default: 0.05, recommended: [0.02, 0.1], range: [-1.0, 1.0], doc: Drain read bias (linear region).}
  icomp_gate: {unit: A, default: 1.0e-6, range: [1.0e-12, 1.0e-3], doc: Gate current compliance of the reads.}
  icomp_drain: {unit: A, default: 1.0e-3, range: [1.0e-12, 1.0e-2], doc: Drain current compliance of the reads.}
  settle: {unit: s, default: 0.0, recommended: [0.0, 1.0], range: [0.0, 60.0],
           doc: "Wait between the route back to the SMU and the read."}
  samples: {type: int, default: 1, range: [1, 100], doc: Spot measurements per spot read.}
  integration:
    type: enum
    choices: [short, medium, long]
    default: medium
    doc: ADC preset of the reads.
quality: {limited: [C, T], untrusted: [V, X, F, D, G, S, U], max_limited_fraction_in_fit: 0.05}
analysis_defaults:
  - {method: memory_window_pulse, options: {vth_method: constant_current, i_crit_a: 1.0e-7}}
provenance:
  sources:
    - blueprint v2 2.7 (kind pulse_read and catalog/blocks.py), 2.10 (nvm.py memory_window_pulse), 3.3 (fefet.pulse_write_read), 4.2 ferro FeFET target (MW from pulses +-10 %)
    - lwp matlab_B1500/lib/SPGU_pulse.m (ERMOD 1, ERSSP p,2 for pulses, ERSSP p,1 back to the SMU for the read)
    - Keysight B1500A self-paced training, SPGU module, AN-TUT p174 (5-28) (flash write/erase pulses through the 16440A
      selector, then every selector channel routed to the SMU for the Vth read; a flash-cell exercise, not a FeFET one)
    - Programming Guide Ed. 15 ERSSP (PDF 433-434), SER (PDF 507), SPRM (PDF 512-513), WV (PDF 568-569)
  validation_runs: []
