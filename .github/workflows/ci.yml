# The full gate on the development OS (macOS) and the lab OS (Windows); blueprint v2 7.1 "Windows CI", 8.1, 10
# (Definition of done). Simulator, visa-loop and fake-ABI only: hardware and harness-acceptance tests never run here.
# Every gate step runs even when an earlier one failed, so one run reports every red gate.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"  # the lab setting (setx PYTHONUTF8 1); tests that need it off set it per child process
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - name: Install (uv.lock, frozen)
        run: uv sync --frozen
      - name: Tests (simulator, visa-loop; parallel)
        if: ${{ !cancelled() }}
        run: uv run pytest -q -m "not hardware and not acceptance and not wall_clock" -n auto
      # Tests that assert a wall-clock bound of the plan (a 4 h instant run < 2 s, ...) run alone: on the 4-vCPU
      # runner the other xdist workers took the CPU they measure (Windows: 1.1 s alone, up to 5.9 s among them).
      - name: Wall-clock tests (alone)
        if: ${{ !cancelled() }}
        run: uv run pytest -q -m "wall_clock and not hardware and not acceptance"
      - name: Lint (ruff)
        if: ${{ !cancelled() }}
        run: uv run ruff check
      - name: Recipe check
        if: ${{ !cancelled() }}
        run: uv run b1500 dev recipe-check
      - name: Skill lint
        if: ${{ !cancelled() }}
        run: uv run b1500 dev lint-skills
      - name: Card index up to date
        if: ${{ !cancelled() }}
        run: uv run b1500 dev gen-index --check
      # docs/coverage.md current and no coverage gap (WP11.2); the ledger it reads is checked against the legacy
      # sources by tests/unit/test_driver_map.py (the rebuild from the archive tag is skipped in a tagless checkout)
      - name: Coverage page and gaps
        if: ${{ !cancelled() }}
        run: uv run b1500 dev coverage --check
      - name: Claude Code skill mirror in sync
        if: ${{ !cancelled() }}
        run: uv run b1500 dev sync-harness --check
      - name: MCP tool budget (10 tools)
        if: ${{ !cancelled() }}
        run: uv run b1500 dev tool-budget
      - name: Manual corpus (no PDFs in CI; manual build --check runs where they are)
        if: ${{ !cancelled() }}
        run: uv run b1500 manual status
      # The lab PC's first check after uv sync (blueprint v2 7.5 line 4): installation and config/local completeness
      # on backend sim, no FAIL (WARN for the generated harness files and the WGFMU library a runner does not have)
      - name: Doctor (backend sim)
        if: ${{ !cancelled() }}
        run: uv run b1500 doctor
