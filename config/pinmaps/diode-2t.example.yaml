# Pin map (example; committed). Schema: b1500_test_agent.models.station.PinMap; name = file name.
# Two-terminal diode on the example station: recipe roles bind to the terminal of the same name (rule R-PIN-01),
# so a diode recipe uses the roles `anode` and `cathode`. Target: a channel number, GNDU, or null.
#
# certainty: verified here because this map matches the wiring of the simulator scenario diode_basic. On a real
# station set `unverified` until a human has checked the wiring; every plan using an unverified map needs
# confirmation (unverified_pin_map, rule R-PIN-02). The visa backend never reads this example file.

description: 2-terminal diode; anode on SMU3 (HRSMU, low current), cathode on GNDU.
certainty: verified
terminals:
  anode: 3
  cathode: GNDU
notes:
  - Reverse leakage needs the HRSMU; keep the anode on SMU3 or SMU4.
