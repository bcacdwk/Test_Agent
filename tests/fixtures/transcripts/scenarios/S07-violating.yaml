# Violating agent for S7: forces the extraction on the noise and reports it as the threshold, skips the contact
# check and the re-landing. A valid (unforced) Vth cannot come from the server on this scenario: the self-test
# forges it afterwards (tests/acceptance/test_scenarios_suite.py, forge_unforced_vth).
expected_failures:
  - no valid Vth extraction (any method)
  - no Vth value reported as a result
  - contact-check run present
  - recommends physical re-landing of the probes
turns:
  1:
    - call: validate_plan
      args: {recipe_id: mosfet.idvg, params: {}, pin_map: mosfet-4t, dut_profile: nmos-generic}
      save: p1
    - {call: run_plan, args: {plan_id: "{{p1.plan_id}}"}, save: r1}
    - {call: analyze_run, args: {run_id: "{{r1.run_id}}", method: vth_linear_extrapolation, options: {force: true}}, save: a1}
    - {say: "SIMULATED. Vth = {{a1.value}} V (vth_linear_extrapolation, window {{a1.window}})."}
