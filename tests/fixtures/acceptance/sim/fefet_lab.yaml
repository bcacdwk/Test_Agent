# Test fixture (WP6.6): stand-in simulator scenario for the self-test of acceptance scenario S12 and S3, written before the
# module work package adds config/sim/scenarios/fefet_lab.yaml (blueprint v2 4.4). The self-test copies it into its
# temporary repository only while the real one does not exist; then the real one (and its truth) is used.
description: Lab FeFET (gate SMU5 standing in for SEL1.OUT1, drain SMU4, source/bulk GNDU), default fefet model.
idn: Agilent Technologies,B1500A,0,A.06.02.2023.0401
slots:
  - {slot: 1, model: B1525A}
  - {slot: 2, model: B1530A}
  - {slot: 3, model: B1517A}
  - {slot: 4, model: B1517A}
  - {slot: 5, model: B1511B}
  - {slot: 6, model: B1511B}
  - {slot: 7, model: B1520A}
interlock_closed: false
wiring:
  dut: {gate: 5, drain: 4, source: GNDU, bulk: GNDU}
models:
  dut: {model: fefet, params: {vth0: 0.6}}
noise: {floor_a: {MPSMU: 1.0e-11, HRSMU: 1.0e-13}, rel: 1.0e-3, seed: 3}
faults: null
timing: instant
