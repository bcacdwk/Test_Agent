# Simulator scenario (committed). Schema: b1500_test_agent.models.station.SimScenario; device params are typed by
# b1500_test_agent.models.sim (DEVICE_PARAMS); consumed by the simulator (transport/sim/). Name = file name. The
# slots mirror config/station.example.yaml; `wiring` is the physical wiring of the simulated prober (independent of
# the agent's pin map); `models` holds the truth parameters tests compare extractions against; noise, faults and
# timing as documented in nmos_basic.yaml.
#
# The MOS capacitor with interface traps of blueprint v2 4.2 (`moscap` + Dit(E) -> frequency dispersion; recipes
# moscap.cf and moscap.ct (WP8.4), moscap.cv_multi_freq and moscap.qscv (WP8.5); cards moscap-cf-ct, moscap-dit;
# bring-up stage L6): the moscap_basic geometry (100 um x 100 um, 5 nm SiO2, p 1e17 cm^-3; DUT profile
# moscap-generic, pin map moscap-cmu: gate on 7H, bulk on 7L) behind the same fixture parasitics, plus a U-shaped
# interface-trap density Dit(E) = 2e11 + 1e10 (cosh(E/0.1 eV) - 1) cm^-2 eV^-1 inside the band gap (2e11 at midgap,
# about 3e11 at E - Ei = -0.3 eV, 9e11 at +-0.5 eV) with capture cross section 1e-16 cm^2. In depletion the traps
# respond with tau = 1/(sigma v_th p_s): the conductance Gp/w peaks at w tau = 1.98 (continuum), e.g. near 40 kHz at
# Vg = -0.6 V (psi_s about 0.17 V) and moves to lower frequency towards midgap (MoscapDevice.interface_trap_truth).
# The minority carriers form the inversion layer with tau_inv = 0.5 s, so a step from accumulation into inversion
# shows deep depletion recovering over seconds (C-t; truth: tau_inv_s, MoscapDevice.deep_depletion_capacitance and
# equilibrium_capacitance). No border traps (hysteresis 0) and a small series resistance (5 Ohm) keep the trap
# signals clean. Truth: Cox = 69.06 pF, Vfb = phi_ms - q Qf / Cox - Qit(0)/Cox = MoscapDevice.vfb() (-0.887 V).
#
# WP8.5: one landing for SMU and MFCMU work. CMU1 has an SCUU (`scuu: [7]`), so 7H/7L are the SCUU outputs (CMUH/
# Force1 = SMU6, CMUL/Force2 = SMU5; PG p520 (4-202)): SSP 7,4 connects the MFCMU (C-V, C-f, C-t, corrections), SSP 7,3
# the two MPSMUs (QSCV `moscap.qscv`, leakage), with the probes untouched; pin map moscap-scuu (gate SCUU1.OUT1, bulk
# SCUU1.OUT2). The QSCV (low-frequency) curve and an HF C-V of this same device give Dit(E) by the high-low method
# (dit_high_low), the C-V at many frequencies by the conductance method (moscap.cv_multi_freq, dit_conductance). The
# MPSMU current floor (1e-13 A at one power-line cycle) is the 1 nA range's, the QSR range a QSCV uses.

description: >-
  MOS capacitor with interface traps (p-Si 1e17 cm^-3, 5 nm SiO2, 100 um x 100 um, U-shaped Dit 2e11 cm^-2 eV^-1 at
  midgap, inversion-layer formation 0.5 s) on CMU1 through its SCUU (gate 7H/SCUU1.OUT1, bulk 7L/SCUU1.OUT2: the
  MFCMU or SMU6/SMU5 on one landing) behind the fixture parasitics; for moscap.cf, moscap.ct (C-f dispersion, C-t
  recovery), moscap.qscv and moscap.cv_multi_freq (Dit by high-low and conductance); instant timing.
idn: Keysight Technologies,B1500A,SIM0000001,A.06.01.2024.0101
slots:                          # lab layout (config/station.example.yaml): SPGU 1, WGFMU 2, HRSMU 3-4, MPSMU 5-6, MFCMU 7
  - {slot: 1, model: B1525A}
  - {slot: 2, model: B1530A}
  - {slot: 3, model: B1517A}
  - {slot: 4, model: B1517A}
  - {slot: 5, model: B1511B}
  - {slot: 6, model: B1511B}
  - {slot: 7, model: B1520A}
scuu: [7]                       # SCUU on CMU1: SMU6 (Force1) and SMU5 (Force2) reach the pads through it
interlock_closed: false
wiring:
  dut:
    gate: 7H
    bulk: 7L
  path:
    high: 7H
    low: 7L
models:
  dut:
    model: moscap
    params:
      substrate: p
      area_um2: 1.0e+4
      tox_nm: 5.0
      eps_ox: 3.9
      nsub_cm3: 1.0e+17
      phi_ms_v: -0.85
      qf_cm2: 5.0e+10
      dit_cm2_ev: 2.0e+11       # midgap interface-trap density (truth of cf_dispersion at a depletion bias, +-25 %)
      dit_edge_cm2_ev: 1.0e+10  # U shape towards the band edges
      dit_width_ev: 0.1
      dit_sigma_cm2: 1.0e-16
      f_inv_hz: 10.0
      tau_inv_s: 0.5            # inversion-layer formation (truth of ct_recovery)
      rs_ohm: 5.0
      leak_s: 1.0e-12
  path:
    model: fixture
    params: {}                  # blueprint 4.2 defaults (sim_devices.FixtureParams); station: TODO(verify)[L6.A2]
noise:
  floor_a: {MPSMU: 1.0e-13, HRSMU: 1.0e-13}
  rel: 2.0e-4
  seed: 17
faults: null
timing: instant
