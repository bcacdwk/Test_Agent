# Recipe (registry source; schema b1500_test_agent.models.recipe.Recipe; checked by `b1500 dev recipe-check`).
# FeFET endurance (card nvm/fefet-endurance-retention, bring-up stage L9; blueprint v2 3.3): bipolar program/erase
# cycling with the HV-SPGU through the 16440A selector (SEL1.OUT1 -> PGU) and checkpoint reads through the same output
# (-> SMU). At each checkpoint (log-spaced cumulative cycle counts, `reads_per_decade` per decade up to `cycles`, or the
# listed `read_cycles`) one cycle runs as erase -> Id-Vg read -> program -> Id-Vg read; the cycles in between run as
# three-level SPGU bursts (erase pulse, program pulse half a `cycle_period` later; at most 1,000,000 periods per burst),
# so 10^6 cycles take cycles x cycle_period of output plus the reads: a long run (async, cancel via safe_shutdown at
# the next checkpoint). Kind pulse_read, schedule cycles with cycle_reads log/list. Default analysis endurance_summary:
# MW(N) = Vth(after erase) - Vth(after program) per checkpoint; wake-up, fatigue, cycles to failure.
# status: sim_validated by tests/integration/test_recipes_nvm_schedules.py (fefet_lab: MW per checkpoint within 10 %
# of the model's wake-up/fatigue truth; 10^6 cycles async with checkpoints and cancel; selector at rest verified);
# hw_validated only through a validation record (stage L9).
id: fefet.endurance
version: 1
title: FeFET endurance - bipolar SPGU cycling with Id-Vg checkpoint reads at log-spaced cycle counts, MW(N)
family: nvm
kind: pulse_read
status: sim_validated
card: .agents/skills/b1500-test/cards/nvm/fefet-endurance-retention.md
device_types: [fefet]
roles:
  gate:
    function: pgu
    module_types: [HVSPGU]
    settings: {program: $v_program, erase: $v_erase, base: 0.0, width: $width, lead: $t_edge, trail: $t_edge,
               load_ohm: $load_ohm}
  gate_read:
    function: sweep_v
    terminal: gate
    measure: [I]
    module_types: [MPSMU, HRSMU, HPSMU]
    settings: {start: $vg_start, stop: $vg_stop, points: $vg_points, v: $vg_read, icomp: $icomp_gate}
  drain:
    function: bias_v
    measure: [I]
    module_types: [MPSMU, HRSMU, HPSMU]
    prefer: HRSMU
    settings: {v: $vd, icomp: $icomp_drain}
  source: {function: ground, allow_gndu: true}
  bulk: {function: ground, allow_gndu: true, optional: true}
params:
  cycles: {type: int, default: 1000000, recommended: [1000, 10000000], range: [1, 1000000000],
           doc: "Program/erase cycles in total (the last checkpoint)."}
  cycle_reads: {type: enum, choices: [log, list], default: log,
                doc: "log: checkpoints at round(10^(k/reads_per_decade)) cycles; list: at read_cycles."}
  reads_per_decade: {type: int, default: 3, recommended: [2, 5], range: [1, 20], doc: Checkpoints per decade (log).}
  read_cycles: {type: float_list, default: [1.0, 10.0, 100.0, 1000.0, 10000.0, 100000.0], range: [1.0, 1.0e+9],
                doc: "Cumulative cycle counts of the checkpoints when cycle_reads is list (integers)."}
  cycle_period: {unit: s, default: 1.0e-3, recommended: [1.0e-5, 1.0e-2], range: [4.0e-8, 1.0],
                 doc: "Period of one bipolar cycle in the bursts (erase pulse, program pulse half a period later)."}
  v_program: {unit: V, default: 4.0, range: [-10.0, 10.0],
              doc: "Program pulse amplitude (cycling and checkpoints; n-FeFET: positive, lowers Vth): example
                default for the simulator FeFET (scenario fefet_lab), not a real-device value; from the request or
                the DUT profile, else ask."}
  v_erase: {unit: V, default: -4.0, range: [-10.0, 10.0],
            doc: "Erase pulse amplitude (cycling and checkpoints; n-FeFET: negative, raises Vth): example default
              (simulator FeFET); from the request or the DUT profile, else ask."}
  width: {unit: s, default: 1.0e-6, range: [1.0e-8, 1.0e-3],
          doc: "Pulse width of program and erase (cycling and checkpoints): example default (simulator FeFET);
            from the request or the DUT profile, else ask."}
  period: {unit: s, default: 1.0e-5, recommended: [1.0e-6, 1.0e-3], range: [2.0e-8, 1.0],
           doc: "Pulse period of the checkpoint operations (matters only with count > 1)."}
  count: {type: int, default: 1, recommended: [1, 10], range: [1, 1000], doc: Pulses per checkpoint operation.}
  t_edge: {unit: s, default: 2.0e-8, recommended: [2.0e-8, 1.0e-6], range: [8.0e-9, 0.4],
           doc: "Leading and trailing transition time (width >= t_edge / 0.8, PG p591 (5-19) error 2111)."}
  load_ohm: {unit: Ohm, default: 1.0e+6, recommended: [1.0e+3, 1.0e+6], range: [0.1, 1.0e+6],
             doc: "Declared load SER (1 MOhm for the insulated gate; 50 Ohm doubles the level on an open gate:
             50 Ohm output, UG p76 (2-36))."}
  sequence: {type: enum, choices: [erase_program, program_erase], default: erase_program,
             doc: "Order of the two operations in every cycle (bursts and checkpoints)."}
  initial_read: {type: bool, default: true, doc: A reference read before the first pulse.}
  schedule: {type: enum, choices: [cycles], default: cycles, doc: "Schedule (cycles with checkpoint reads)."}
  read_kind: {type: enum, choices: [staircase, spot], default: staircase,
              doc: "staircase: Id-Vg per read (Vth, MW); spot: Id at vg_read (read current window)."}
  vg_start: {unit: V, default: -0.5, range: [-5.0, 5.0],
             doc: "Read sweep start (below your programmed Vth): example default; from the request or the DUT
              profile, else ask."}
  vg_stop: {unit: V, default: 1.8, range: [-5.0, 5.0],
            doc: "Read sweep stop: must stay below YOUR device's Vc (from the request or the DUT profile; else ask);
              1.8 V suits the simulator FeFET (Vc 2.8 V, scenarios fefet_basic/fefet_lab)."}
  vg_points: {type: int, default: 47, recommended: [31, 101], range: [11, 401], doc: Read sweep points.}
  vg_read: {unit: V, default: 0.6, range: [-5.0, 5.0],
            doc: "Gate level of a spot read (between your two Vth states): example default; from the request or
              the DUT profile, else ask."}
  vd: {unit: V, default: 0.05, recommended: [0.02, 0.1], range: [-1.0, 1.0], doc: Drain read bias (linear region).}
  icomp_gate: {unit: A, default: 1.0e-6, range: [1.0e-12, 1.0e-3], doc: Gate current compliance of the reads.}
  icomp_drain: {unit: A, default: 1.0e-3, range: [1.0e-12, 1.0e-2], doc: Drain current compliance of the reads.}
  settle: {unit: s, default: 0.0, recommended: [0.0, 1.0], range: [0.0, 60.0],
           doc: "Wait between the route back to the SMU and each read."}
  samples: {type: int, default: 1, range: [1, 100], doc: Spot measurements per spot read.}
  integration:
    type: enum
    choices: [short, medium, long]
    default: medium
    doc: ADC preset of the reads.
quality: {limited: [C, T], untrusted: [V, X, F, D, G, S, U], max_limited_fraction_in_fit: 0.05}
analysis_defaults:
  - {method: endurance_summary, options: {vth_method: constant_current, i_crit_a: 1.0e-7}}
provenance:
  sources:
    - blueprint v2 2.7 (kind pulse_read, schedule cycles), 2.10 (nvm.py endurance_summary), 3.3 (fefet.endurance), 4.2 ferro FeFET (wake-up/fatigue)
    - Keysight B1500A self-paced training, SPGU module, AN-TUT p170 (5-24) (flash endurance with repeated write/erase
      pulses and Vth reads after set cycle counts) and AN-TUT p174 (5-28) (Vth read at each decade through the
      selector's SMU path);
      AN-NVM p72-74 "FeRAM Endurance" (reads a set number of times per decade of cycles); flash and FeRAM tests, not
      FeFET ones
    - Programming Guide Ed. 15 SPM three-level output (PDF 146, 511), SPRM (PDF 512-513), SPT (PDF 514), ERSSP (PDF 433-434)
  validation_runs: []
