# Simulator scenario (committed). Schema: b1500_test_agent.models.station.SimScenario; device params are typed by
# b1500_test_agent.models.sim (DEVICE_PARAMS); consumed by the simulator (transport/sim/). Name = file name. The
# slots mirror config/station.example.yaml; `wiring` is the physical wiring of the simulated prober (independent of
# the agent's pin map); `models` holds the truth parameters tests compare extractions against; noise, faults and
# timing as documented in nmos_basic.yaml.

description: >-
  Damaged landing on the nmos_basic device (mosfet-4t wiring): the drain probe is not landed (open drain), so the
  drain current is only noise, at a raised noise floor; gate leakage is unchanged. Instant timing.
idn: Keysight Technologies,B1500A,SIM0000001,A.06.01.2024.0101
slots:
  - {slot: 1, model: B1511B}
  - {slot: 2, model: B1511B}
  - {slot: 3, model: B1517A}
  - {slot: 4, model: B1517A}
  - {slot: 5, model: B1530A}
  - {slot: 6, model: B1525A}
  - {slot: 7, model: B1520A}
interlock_closed: false
wiring:
  dut:
    gate: 4
    drain: 3
    source: GNDU
    bulk: GNDU
models:
  dut:
    model: mosfet_damaged
    params:
      damage: open_drain        # drain disconnected from the channel: SMU3 measures the noise floor only
      polarity: n
      vth0: 0.42                # same device as nmos_basic; no valid Vth can be extracted here
      slope_factor: 1.3
      beta: 2.0e-3
      theta: 0.2
      lambda: 0.05
      rs_ohm: 20.0
      gate_leak_s: 1.0e-12
      temperature_k: 300.0
noise:
  floor_a: {MPSMU: 5.0e-11, HRSMU: 5.0e-12}   # noisy: unshielded, probe lifted
  rel: 2.0e-3
  seed: 7
faults: null
timing: instant
