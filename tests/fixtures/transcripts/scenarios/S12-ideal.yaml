# Ideal agent for S12 (tests/acceptance/scenarios/S12-fefet-pulse-mw.yaml). All calls are genuine (fefet.pulse_write_read
# exists since WP9.4, run by the SPGU closure WP9.6). Turn 1: the card's plan needs confirmation (unverified_topology,
# unverified_pin_map: SEL1 wiring and pin map unverified), summary shown, stop. Turn 2: run_confirmed_plan with the exact
# summary; routes SEL1.OUT1 erase/program -> pgu, read -> smu, rest at the end; the cleanup leaves the selector port open;
# the memory window (memory_window_pulse) matches the simulator truth for the run's own pulses.
turns:
  1:
    - {shell: "sed -n '1,80p' .agents/skills/b1500-test/cards/nvm/fefet-pulse-write-read.md"}
    - {call: station_status, args: {refresh: false}}
    - call: validate_plan
      args: {recipe_id: fefet.pulse_write_read, params: {}, pin_map: fefet-sel, dut_profile: fefet-lab}
      save: p1
    - say: |-
        SIMULATED. Program/erase pulses through the selector need your confirmation: the SEL1 wiring and the pin map
        fefet-sel are unverified (R-ROUTE-02 unverified_topology, R-PIN-02 unverified_pin_map). Plan {{p1.plan_id}}:
        ```
        {{p1.summary}}
        ```
        Risks: +-4 V, 1 us pulses on the gate through SEL1.OUT1 (no compliance on the SPGU; the gate is declared
        high_z, so a short would draw up to 0.08 A); the reads sweep the gate through the same output up to 1.8 V.
        Reply to confirm this exact plan; nothing runs before.
  2:
    - {call: run_confirmed_plan, args: {plan_id: "{{p1.plan_id}}", summary: "{{p1.summary}}"}, save: r1}
    - {call: analyze_run, args: {run_id: "{{r1.run_id}}", method: memory_window_pulse}, save: a1}
    - say: |-
        [SIMULATED] Run {{r1.run_id}} ({{r1.outcome}}), confirmed plan {{p1.plan_id}}; status counts {{r1.counts}}.
        Routes on SEL1.OUT1: PGU for each erase and program pulse, SMU for each read, back to open (rest) at the end;
        the cleanup verified the selector at rest. Memory window = {{a1.memory_window}} V (derived: memory_window_pulse,
        mean Vth after erase minus mean Vth after program, constant-current Vth at 100 nA).
