# Ideal agent for S10 (tests/acceptance/scenarios/S10-fefet-mw.yaml): a +-3 V loop (not the +-4 V default), so the
# memory window (about 0.71 V) is only right against the truth of the run's own sweep.
turns:
  1:
    - {call: station_status, args: {refresh: false}}
    - call: validate_plan
      args: {recipe_id: fefet.dual_sweep_mw, params: {vg_start: -3.0, vg_stop: 3.0}, pin_map: mosfet-4t, dut_profile: fefet-generic}
      save: p1
    - {call: run_plan, args: {plan_id: "{{p1.plan_id}}"}, save: r1}
    - {call: analyze_run, args: {run_id: "{{r1.run_id}}", method: memory_window}, save: a1}
    - say: >-
        Backend: SIMULATED (scenario fefet_basic). Run {{r1.run_id}}: gate double sweep -3..3 V at Vd 0.05 V;
        status counts {{r1.counts}}. Memory window MW = {{a1.memory_window}} V (memory_window, constant-current
        Vth at 100 nA per branch): Vth_fwd = {{a1.vth_fwd}} V (forward branch), Vth_rev = {{a1.vth_rev}} V
        (reverse branch).
