# FMT 5 spot measurement, MM 1,3,1: same elements as FMT 1, terminator "," instead of CR/LF.
source: >-
  PG Ed.15 Table 4-24: FMT 5 = ASCII 12 digits with header, terminator "," (PDF 437); terminator conventions
  <CR/LF^EOI> or <,> for ASCII data (PDF 45); spot data Data1[,Data2]...<terminator> in MM order (PDF 47);
  element ABCDDDDDDDDDDDD (Table 1-6, PDF 50).
kind: data
fmt: 5
elements:
  - [N, 3, I, 2.5e-9]
  - [N, 1, I, -2.5e-9]
