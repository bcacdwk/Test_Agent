# Simulator scenario (committed). Schema: b1500_test_agent.models.station.SimScenario. Name = file name.
# An n-channel transistor on the two WGFMU channels (blueprint v2 3.4 rows wgfmu.pulsed_iv, wgfmu.fast_iv,
# wgfmu.pulse_train; 4.2 "WGFMU engine"; stage L8 "fast vs DC Id-Vg"): gate on WGFMU 201, drain on WGFMU 202 (each
# through its RSU), source on the GNDU, bulk on SMU5 (off unless a recipe body-biases it: then it floats at the source
# potential, as on the GNDU). The RSUs' "From SMU" inputs are cabled to SMU4 (gate) and SMU3 (drain) (WG p20 (1-8)):
# while an RSU is not on its WGFMU path its terminal sees that SMU, so the DC Id-Vg of pin map mosfet-4t (gate SMU4,
# drain SMU3) measures the same device as the WGFMU recipes on pin map mosfet-wgfmu (rsu_smu, ATV-32 on hardware).
#
# Truth (tests/integration/test_recipes_wgfmu.py): model `mosfet` without self-heating or trapping, so a pulsed Id
# at low duty equals the DC Id (blueprint 10.6 row 10.4 AC: +-2 %); its quasi-static drain current is the reference.
# Noise: the WGFMU's white noise per 5 ns sample on the 10 mA range (scaled by the range, averaged as 1/sqrt(n) over a
# point's samples), 0.1 % relative noise, the SMU floors. Example values, not a measured device.

description: >-
  n-channel MOSFET on WGFMU 201 (gate) and 202 (drain) through their RSUs, source GNDU, bulk SMU5; the RSUs' SMU inputs
  carry SMU4 (gate) and SMU3 (drain), so mosfet-4t DC runs reach the same device; no self-heating; instant timing.
idn: Keysight Technologies,B1500A,SIM0000001,A.06.01.2024.0101
slots:                          # lab layout (config/station.example.yaml): SPGU 1, WGFMU 2, HRSMU 3-4, MPSMU 5-6, MFCMU 7
  - {slot: 1, model: B1525A}
  - {slot: 2, model: B1530A}
  - {slot: 3, model: B1517A}
  - {slot: 4, model: B1517A}
  - {slot: 5, model: B1511B}
  - {slot: 6, model: B1511B}
  - {slot: 7, model: B1520A}
interlock_closed: false
rsu_smu: {201: 4, 202: 3}       # RSU "From SMU" inputs: SMU4 -> RSU201 (gate), SMU3 -> RSU202 (drain)
wiring:
  dut:
    gate: 201
    drain: 202
    source: GNDU
    bulk: 5
models:
  dut:
    model: mosfet
    params:
      polarity: n
      vth0: 0.5                 # V
      slope_factor: 1.3
      beta: 3.0e-4              # A/V^2
      theta: 0.2                # 1/V
      lambda: 0.05              # 1/V
      rs_ohm: 20.0
      gate_leak_s: 1.0e-12
      temperature_k: 300.0
noise:
  floor_a: {MPSMU: 1.0e-11, HRSMU: 1.0e-13, WGFMU: 2.0e-6}
  rel: 1.0e-3
  seed: 104
faults: null
timing: instant
