# Golden FLEX strings of the SMU builders added by WP7.1 (driver/flex/smu.py), each with the page of its syntax in the
# Keysight B1500 Series Programming Guide Ed. 15 (PG; physical PDF page, printed page). The manual's own examples are
# copied verbatim where it prints one. Loaded by tests/unit/test_driver_spot_asu.py.
- {builder: di, args: [1, 0, 1.0e-6, 2.0], expected: "DI 1,0,1E-06,2", page: "PG p391 (4-73)"}
- {builder: di, args: [3, 14, 5.0e-7, 20.0], expected: "DI 3,14,5E-07,20", page: "PG p392 (4-74)", note: manual example DI 3,14,5E-7,20,0,0 without the defaulted polarity and vrange}
- {builder: di, args: [3, 0, -0.01, 1.0], expected: "DI 3,0,-0.01,1", page: "PG p391 (4-73)", note: a negative current, Kelvin reversal}
- {builder: di, args: [4, 8, 0.0, 2.0], expected: "DI 4,8,0,2", page: "PG p340 (4-22)", note: 0 A voltmeter on the 1 pA (ASU) output range}
- {builder: mm, args: [1, [3, 4, 5, 6]], expected: "MM 1,3,4,5,6", page: "PG p470 (4-152)", note: spot measurement of four SMUs}
- {builder: ri, args: [4, 8], expected: "RI 4,8", page: "PG p501 (4-183)", note: 1 pA limited auto (ASU)}
- {builder: ri, args: [3, -9], expected: "RI 3,-9", page: "PG p501 (4-183)", note: 10 pA fixed (zero check)}
# SMU conditioning (WP7.7, blueprint v2 1.2: RM, AV, AZ, FL, SSR) and the multi-channel sweep clear WNCC.
- {builder: fl, args: [true], expected: "FL 1", page: "PG p436 (4-118)", note: manual example (all SMUs)}
- {builder: fl, args: [false, [1, 3, 5]], expected: "FL 0,1,3,5", page: "PG p436 (4-118)", note: manual example}
- {builder: ssr, args: [1, true], expected: "SSR 1,1", page: "PG p521 (4-203)", note: manual example}
- {builder: az, args: [false], expected: "AZ 0", page: "PG p363 (4-45)", note: manual example}
- {builder: av, args: [10], expected: "AV 10", page: "PG p363 (4-45)", note: manual example}
- {builder: av, args: [-50], expected: "AV -50", page: "PG p363 (4-45)", note: manual example (50 PLC)}
- {builder: av, args: [100, 1], expected: "AV 100,1", page: "PG p363 (4-45)", note: manual example (manual mode)}
- {builder: rm, args: [1, 2], expected: "RM 1,2", page: "PG p502 (4-184)", note: manual example}
- {builder: rm, args: [2, 3, 60], expected: "RM 2,3,60", page: "PG p502 (4-184)", note: manual example}
- {builder: wncc, args: [], expected: "WNCC", page: "PG p556 (4-238)"}
