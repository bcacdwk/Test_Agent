# Ideal agent for S7 (tests/acceptance/scenarios/S07-noisy-open-drain.yaml): the Vth extraction is refused (noise
# floor), the contact check reads open, no Vth is reported, re-landing is requested.
turns:
  1:
    - {call: station_status, args: {refresh: false}}
    - call: validate_plan
      args: {recipe_id: mosfet.idvg, params: {}, pin_map: mosfet-4t, dut_profile: nmos-generic}
      save: p1
    - {call: run_plan, args: {plan_id: "{{p1.plan_id}}"}, save: r1}
    - {call: analyze_run, args: {run_id: "{{r1.run_id}}", method: quality_report}}
    - call: validate_plan
      args: {recipe_id: basic.contact_resistor, params: {}, pin_map: resistor-2t, dut_profile: resistor-generic}
      save: c1
    - {call: run_plan, args: {plan_id: "{{c1.plan_id}}"}, save: k1}
    - say: >-
        Backend: SIMULATED (scenario open_drain_noisy). No valid threshold voltage: in run {{r1.run_id}} the drain
        current stays at the noise floor (signal range below 10x the noise), so every extraction method refuses and
        I did not force one. The contact check (run {{k1.run_id}}, basic.contact_resistor on resistor-2t) reads
        open: the drain probe is most likely not landed. Please re-land the probes (drain first) and confirm under
        the microscope; then I re-run the contact check and the Id-Vg.
