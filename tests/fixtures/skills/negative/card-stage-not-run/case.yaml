description: The card's bring-up stage file does not run the card's recipe (and names an unregistered one); the stage's step that runs the card's recipe no longer fits the stage either.
edits:
  - file: .agents/skills/b1500-bringup/stages/l4-mosfet.md
    old: "recipes: [mosfet.idvg]"
    new: "recipes: [mosfet.idvg_pulsed]"
  - file: .agents/skills/b1500-bringup/stages/l4-mosfet.md
    old: "{id: vth, recipe: mosfet.idvg,"
    new: "{id: vth, recipe: mosfet.idvg_pulsed,"
expect:
  - {code: stage, file: .agents/skills/b1500-bringup/stages/l4-mosfet.md, contains: "recipes lists mosfet.idvg_pulsed, which is not a registered recipe"}
  - {code: card_stage, file: .agents/skills/b1500-test/cards/smu/mosfet-idvg.md, contains: "bring-up stage L4 does not run ['mosfet.idvg']"}
  - {code: steps, file: .agents/skills/b1500-bringup/steps.yaml, contains: "L4.A1: recipe mosfet.idvg is run by neither stage L4 nor an earlier stage"}
