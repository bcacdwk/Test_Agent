# The visa backend never reads this example file.

description: FeCap; top electrode RSU201.OUT (WGFMU 201), bottom electrode RSU202.OUT (WGFMU 202).
certainty: unverified
terminals:
  top: RSU201.OUT
  bottom: RSU202.OUT
notes:
  - PUND forces on the top electrode and measures the switching current on the bottom electrode.
