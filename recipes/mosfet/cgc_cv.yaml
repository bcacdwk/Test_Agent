# Recipe (registry source; schema b1500_test_agent.models.recipe.Recipe; checked by `b1500 dev recipe-check`).
# MOSFET split C-V, gate-to-channel capacitance Cgc (kind cmu_measure, MM 18; card mosfet-split-cv; blueprint v2 3.2,
# bring-up stage L6): gate on the MFCMU High side (DC bias sweep vg_start -> vg_stop, Cp-G), drain on the Low side,
# bulk grounded (GNDU or an SMU at 0 V). The source is no role: it is tied to the drain at the MFCMU Low cable (pin
# map target 7L) or left floating (an SMU this recipe never switches on, pin map mosfet-split-cv), so the whole
# channel charge returns through the Low side; never ground it (that measures Cgd, recipe mosfet.cgd_cv). Low
# frequency (100 kHz) keeps the channel resistance out of the reading. The inversion plateau extrapolates to
# Cox*W*L (overlap floor removed); the onset of the Cgc rise gives Vth. Needs fresh phase/open/short corrections of
# this pin map at every frequency (R-CORR-01). Programming Guide Ed. 15: C-V sweep (PDF 256-260), MM 18 (PDF 470-471).
# status: sim_validated by tests/integration/test_recipes_cv.py (nmos_cv: plateau Cox*W*L +-2 % of the model truth);
# the visa path by tests/visa_loop/test_cv_visa.py; hw_validated only through a reviewed validation record (stage L6).
id: mosfet.cgc_cv
version: 1
title: MOSFET split C-V, gate-to-channel capacitance Cgc (Cox*W*L plateau, Vth)
family: cmu
kind: cmu_measure
status: sim_validated
card: .agents/skills/b1500-test/cards/cmu/mosfet-split-cv.md
device_types: [nmos, pmos]
roles:
  gate:
    function: cmu_high
    module_types: [MFCMU]
    settings: {freqs: $freqs_hz, ac: $ac_vrms, start: $vg_start, stop: $vg_stop, points: $points, mode: $sweep_mode,
               hold: $hold_s, delay: $delay_s, model: cp_g}
  drain: {function: cmu_low, module_types: [MFCMU]}
  bulk: {function: ground, allow_gndu: true}
params:
  freqs_hz:
    type: float_list
    unit: Hz
    default: [1.0e+5]
    range: [1.0e+3, 5.0e+6]
    doc: Measurement frequencies, one sweep each (low enough that the channel follows; in the correction list).
  ac_vrms: {unit: V, default: 0.03, recommended: [0.01, 0.05], range: [0.01, 0.25], doc: Oscillator level (V rms).}
  vg_start: {unit: V, default: -1.5, recommended: [-3.0, 0.0], range: [-25.0, 25.0], doc: Gate DC bias start (accumulation).}
  vg_stop: {unit: V, default: 2.5, recommended: [1.0, 3.0], range: [-25.0, 25.0], doc: Gate DC bias stop (strong inversion).}
  points: {type: int, default: 81, recommended: [41, 201], range: [11, 1001], doc: Bias steps per sweep direction.}
  sweep_mode: {type: enum, choices: [single, double], default: single, doc: single start->stop; double start->stop->start.}
  hold_s: {unit: s, default: 0.5, recommended: [0.0, 2.0], range: [0.0, 60.0], doc: Hold at vg_start before the first step.}
  delay_s: {unit: s, default: 0.0, recommended: [0.0, 0.1], range: [0.0, 10.0], doc: Delay per step before the measurement.}
  integration:
    type: enum
    choices: [short, medium, long]
    default: medium
    doc: MFCMU averaging (short ACT 0,1; medium ACT 0,2 = initial; long ACT 2,2 = two power-line cycles).
quality: {limited: [], untrusted: [U, D, V, X, C, T, F, G, S], max_limited_fraction_in_fit: 0.05}
analysis_defaults:
  - {method: cv_cox, options: {}}
  - {method: cv_vth, options: {}}
provenance:
  sources:
    - "blueprint v2 2.7 (kind cmu_measure), 3.2 (mosfet.cgc_cv), 4.2 (mosfet +cv, Cgc plateau = Cox*W*L +-2 %)"
    - Programming Guide Ed. 15 C-V sweep (PDF 256-260), MM 18 (PDF 470-471)
    - Koomen, Solid-State Electron. 16, 801 (1973); Sodini et al., Solid-State Electron. 25, 833 (1982) (split C-V)
  validation_runs: []
