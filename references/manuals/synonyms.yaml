# Search synonyms for `b1500 manual search` (blueprint 5.2). Schema: b1500_test_agent.models.manuals.Synonyms.
# Used only when no page holds any query term (after AND, then OR): each query word or the whole query, folded to
# lower case, adds the listed terms. Keep it small and about vocabulary the manuals spell differently.
synonyms:
  selector: [ERSSP, ERMOD, 16440A]
  switch: [ERSSP, SSP, selector]
  duty: [period, width]
  ground: [GNDU]
  compliance: [Icomp, Vcomp]
  timestamp: [TSC, TSR, "time stamp"]
  sampling: [MT, ML, MV, MI]
  autocal: [CM, "auto calibration"]
  selftest: ["*TST?", "self-test"]
  reset: ["*RST", "initial settings"]
  waveform: [ALWG, pattern, vector]
  impedance: [SER, load]
  rtn: [random telegraph noise, 随机电报噪声]
  fefet: [ferroelectric, FeRAM]
  endurance: [cycling, NVM]
  开路: [open]
  短路: [short]
  校正: [correction, compensation]
  补偿: [compensation]
  脉冲: [pulse]
  电容: [capacitance, CMU]
  漏电: [leakage]
  阈值: [threshold, Vth]
  击穿: [breakdown]
  噪声: [noise]
  随机电报噪声: [RTN, random telegraph noise]
  选择器: [selector, ERSSP, 16440A]
