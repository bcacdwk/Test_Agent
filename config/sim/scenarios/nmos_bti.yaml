# Simulator scenario (committed). Schema: b1500_test_agent.models.station.SimScenario. Name = file name.
# An n-channel MOSFET that ages under stress (blueprint v2 4.2 `mosfet` + `bti`/`hci`, 3.1 rows reliability.bti_sms,
# reliability.hci and reliability.silc, 3.4 row wgfmu.fast_bti; acceptance S14/S15) on the lab mainframe. Two devices
# share the gate: `dut` (model `mosfet`, the channel: EKV + BTI + HCI) and `gox` (model `dielectric`, the gate oxide to
# the bulk: leakage, SILC and TDDB).
# Wiring (WP10.7, as nmos_wgfmu): gate on WGFMU 201 and drain on WGFMU 202, each through its RSU, whose "From SMU"
# inputs are cabled to SMU4 (gate) and SMU3 (drain) (WG p20 (1-8)); source on the GNDU, bulk on SMU5 (off unless a
# recipe body-biases it: then it floats at the source potential, as on the GNDU). While an RSU is not on its WGFMU path
# its terminal sees that SMU (the RSU's normal path, WG p19 (1-7)), so the SMU recipes on pin map mosfet-4t (gate SMU4,
# drain SMU3) and the WGFMU fast BTI on pin maps mosfet-wgfmu(-body) stress and read the same transistor (ATV-32 on
# hardware: TODO(verify)[L9.A9]; fallback: separate SMU wiring in the pin map).
#
# Truth (tests/integration/test_recipes_stress.py asserts the default analyses against it; models/sim_devices.py):
# - BTI (reliability.bti_sms, wgfmu.fast_bti): above a gate-source bias of bti_v_min = 1.5 V the threshold rises as
#   dVth = bti_a x Vgs^bti_gamma x t^bti_n (A = 20 mV at 2 V and 1 s; n = 0.2, so +90 mV after 30 min at 2 V); at
#   lower gate bias it recovers as dVth0 x (1 - 0.1 log10(1 + t/1 s)). Targets (4.2): n +-0.02, A +-10 %.
# - HCI (reliability.hci): with the channel on and the drain biased, beta falls as |dId/Id0| = hci_b x
#   (Vds/1 V)^4 x t^hci_m (m = 0.45; 6.6e-3 x t^0.45 at Vds 2.5 V: -15 % after 1000 s). The classical long-channel
#   worst case Vg = Vd/2 (1.2 V) stays below bti_v_min, so the linear-region drain current degrades by HCI alone.
#   Targets (4.2): m +-0.03.
# - SILC and TDDB (reliability.silc): the oxide (3 nm, 10 um2) leaks leak_s x V plus Fowler-Nordheim tunnelling and
#   gains silc_s x D x V of stress-induced leakage with the damage D = t / t_bd(V); E-model life t_bd(2.8 V) = 21.7 ks
#   for this site (seed 77, Weibull W 1.13), so a 1000 s stress at 2.8 V gives D = 0.046 and a SILC ratio of about
#   2.8 at 1.5 V (exponent 1: D grows linearly at constant stress). BTI and HCI stresses (2 V, 1.2 V) leave the oxide
#   practically undamaged (t_bd(2 V) about 1.3e7 s). Breakdown would put r_bd_ohm between gate and bulk.
# Recovery during reads: the simulator ages devices only in timed holds (MM 10) and WGFMU executions; its SMU
# sweeps and spot reads are quasi-static, so reliability.bti_sms shows no read-induced recovery here (on hardware a
# slow read does lose part of the shift); wgfmu.fast_bti's reads are WGFMU executions and do age the device.
# Device values (Vth 0.45 V, SS about 77 mV/dec, beta 2 mA/V^2) are simulator example values, not a real-device
# value; the ageing constants are chosen so a 30-minute stress shows every effect clearly. Real BTI, HCI and SILC
# magnitudes depend on the technology and the temperature (a real device's: TODO(verify)[L9.A4, L9.A7]). No
# self-heating (rth 0).
# Noise: HRSMU floor 1e-13 A and 0.02 % relative noise, so a 1 s BTI shift (20 mV) and a 1 s HCI change (0.7 %) are
# far above the read noise; the WGFMU's white noise per 5 ns sample on the 10 mA range (as nmos_wgfmu, averaged as
# 1/sqrt(n) over a point's samples), so a 1 us sense point on the 1 mA range reads about 14 nA rms.

description: >-
  n-channel MOSFET with BTI (n 0.2), HCI (m 0.45) and a gate oxide with SILC/TDDB on the lab mainframe; gate WGFMU 201
  and drain WGFMU 202 through their RSUs, whose SMU inputs carry SMU4 (gate) and SMU3 (drain), so pin map mosfet-4t
  reaches the same device; source GNDU, bulk SMU5; instant timing.
idn: Agilent Technologies,B1500A,0,A.06.02.2023.0401
slots:                          # lab layout (config/station.example.yaml): SPGU 1, WGFMU 2, HRSMU 3-4, MPSMU 5-6, MFCMU 7
  - {slot: 1, model: B1525A}
  - {slot: 2, model: B1530A}
  - {slot: 3, model: B1517A}
  - {slot: 4, model: B1517A}
  - {slot: 5, model: B1511B}
  - {slot: 6, model: B1511B}
  - {slot: 7, model: B1520A}
interlock_closed: false
rsu_smu: {201: 4, 202: 3}       # RSU "From SMU" inputs: SMU4 -> RSU201 (gate), SMU3 -> RSU202 (drain)
wiring:
  dut:
    gate: 201
    drain: 202
    source: GNDU
    bulk: 5
  gox:
    top: 201                    # the gate electrode (RSU201: WGFMU 201, or SMU4 on the RSU's SMU path)
    bottom: GNDU                # the substrate (bulk)
models:
  dut:
    model: mosfet
    params:
      polarity: n
      vth0: 0.45                # V
      slope_factor: 1.3         # SS = n ln10 kT/q, about 77 mV/dec
      beta: 2.0e-3              # A/V^2
      theta: 0.2                # 1/V
      lambda: 0.05              # 1/V
      rs_ohm: 10.0
      gate_leak_s: 0.0          # the gate leakage is the oxide's (device gox)
      temperature_k: 300.0
      bti_a: 2.5e-3             # V at 1 V and 1 s; A = 2.5e-3 x 2^3 = 20 mV at 2 V
      bti_gamma: 3.0
      bti_n: 0.2
      bti_v_min: 1.5            # V: no BTI at or below 1.5 V gate-source bias (reads, HCI at Vg 1.2 V)
      bti_recovery: 0.1         # per decade
      bti_recovery_t0_s: 1.0
      hci_b: 1.7e-4
      hci_m: 0.45
      hci_vd_ref_v: 1.0
      hci_vd_exp: 4.0
  gox:
    model: dielectric
    params:
      area_um2: 10.0
      tox_nm: 3.0
      eps_r: 3.9
      leak_s: 1.0e-11           # 15 pA at 1.5 V before the stress
      silc_s: 6.0e-10           # S at damage 1
      ebd_mv_cm: 15.0           # BDV 4.5 V, above the 3 V DUT envelope
      tbd_eta_s: 2.0e4          # characteristic life at tbd_v_ref
      tbd_v_ref: 2.8
      tbd_gamma_per_v: 8.0
      weibull_beta: 1.5
      seed: 77                  # site 0: W = 1.13, t_bd(2.8 V) = 21.7 ks
      r_bd_ohm: 1.0e4
noise:
  floor_a: {MPSMU: 1.0e-11, HRSMU: 1.0e-13, WGFMU: 2.0e-6}
  rel: 2.0e-4
  seed: 76
faults: null
timing: instant
