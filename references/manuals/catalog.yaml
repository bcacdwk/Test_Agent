# Keysight manual catalog (blueprint 5.2). Schema: b1500_test_agent.models.manuals.ManualCatalog. No manual text.
#
# `file` is relative to the manuals folder: settings.manuals_dir (default "..", the clone's parent) or
# $B1500_MANUALS_DIR. A renamed or moved copy is found by size + sha256; another edition at `file` is a warning.
# The page text lives in corpus/ (uv run b1500 manual build; committed, OD-1). Citations read `PG p433 (4-115)`:
# id, physical 1-based PDF page, optional printed label (checked by b1500 dev lint-skills).
# `label_rule`: regex with >= 1 group, tried on the first and last three non-empty lines of a page; the first
# non-empty group is the printed label. `priority` multiplies search scores (PG/WG/SEL/CC boosted; WG5 superseded).
# `extracts`: curated files under references/manuals/ that answer queries when no corpus is built.
# After editing a sha256, page count, label rule or the symbol table: uv run b1500 manual build (then --check).
version: 1

# Private-use glyphs of the manuals' Symbol/Wingdings fonts (PDFium returns U+F000 + font code). Unlisted codes in
# U+F020..U+F07E become the ASCII character they encode (digits, brackets, the barcode font of AN-TUT).
symbols:
  F02D: "-"
  F040: "≅"
  F044: "Δ"
  F053: "Σ"
  F057: "Ω"
  F061: "α"
  F062: "β"
  F064: "δ"
  F065: "ε"
  F066: "φ"
  F067: "γ"
  F06C: "λ"
  F06D: "µ"
  F070: "π"
  F071: "θ"
  F072: "ρ"
  F073: "σ"
  F074: "τ"
  F077: "ω"
  F09F: "•"
  F0A3: "≤"
  F0A5: "∞"
  F0AC: "←"
  F0AD: "↑"
  F0AE: "→"
  F0AF: "↓"
  F0B0: "°"
  F0B1: "±"
  F0B3: "≥"
  F0B4: "×"
  F0B7: "•"
  F0B9: "≠"
  F0BB: "≈"
  F0D6: "√"

