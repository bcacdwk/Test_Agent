# Test-only recipe (never in recipes/; WP7.2): a voltage sweep on terminal a with a constant current bias (DI) on
# terminal b, both measured, terminal g on the GNDU. Runs on the test scenario of two resistors to the GNDU
# (tests/integration/sweep_cases.py: a = SMU3, b = SMU5): a_I = V/R_a, b_V = i_b x R_b.
id: generic.bias_current
version: 1
title: Test-only voltage sweep with a current bias (bias_i)
family: smu
kind: smu_staircase
status: sim_validated
card: null
device_types: []
roles:
  a:
    function: sweep_v
    measure: [I]
    settings: {start: 0.0, stop: 1.0, points: $points, icomp: 1.0e-3}
  b:
    function: bias_i
    measure: [V]
    settings: {i: $i_b, vcomp: 2.0}
  g: {function: ground, allow_gndu: true}
params:
  points: {type: int, default: 11, range: [2, 1001], doc: "Sweep points."}
  i_b: {unit: A, default: 5.0e-6, range: [-1.0e-4, 1.0e-4], doc: "Current forced on b."}
  integration: {type: enum, choices: [short, medium, long], default: medium, doc: "ADC preset."}
quality: {limited: [C, T], untrusted: [V, X, F, D, G, S, U], max_limited_fraction_in_fit: 0.05}
analysis_defaults: []
provenance:
  sources:
    - tests (WP7.2 current sources)
  validation_runs: []
