# Hardware validation record (skill b1500-bringup; schema ValidationRecord in src/b1500_test_agent/models/validation.py).
# `uv run b1500 bringup record STAGE --run H...` drafts it into work/bringup/records/ from hardware runs only (run ids
# H..., backend visa; simulator S... runs are refused). A human reviewer checks it against the raw runs, fills
# `reviewer` and `reviewed_on` and moves it to validation/hw/<recipe_id>.yaml (recipe record) or
# validation/hw/stage-<stage>.yaml (stage record). Measured values are copied from the runs, never edited; the
# stage's step ledger entries are copied into `steps` (schema version 2), so the reviewer signs the step list.
schema_version: 2         # 2: with steps (v2 records without this key are version 1)
stage: ""                 # bring-up stage id: S0, L0 .. L10
recipe_id: null           # e.g. mosfet.idvg; null for a stage record
recipe_version: null      # recipe version at the runs
recipe_sha256: null       # definition digest of the recipe (b1500 dev recipe-check recomputes it from recipes/)
backend: visa
station:
  name: ""                # config/local/station.yaml name
  idn: ""                 # *IDN? answer of the runs
  firmware: ""
dut:
  profile: ""             # DUT profile name
  instance: ""            # die, lot or standard label
  reference: ""           # reference used: DMM, certificate, EasyEXPERT export
runs: []                  # hardware run ids, e.g. H20261201T093012Z-1a2b
evidence: []              # per run: run_id, recipe_id, recipe_file_sha256, plan_hash, pin_map, dut_profile,
                          # started_at, outcome, cleanup, quality_verdict, status_counts (copied from the manifest)
probe: null               # probe record work/bringup/probe-<UTC>.json (stage L0)
measurements: []          # per value: check, quantity, value, unit, observed, run_id, method, reference,
                          # reference_source, tolerance (the stage's criterion text; "provisional" = no checked
                          # basis, the owner confirms it before signing), passed
result: ""                # pass | fail ("" while undecided)
operator: ""              # who ran the stage
date: ""                  # UTC date of the runs (YYYY-MM-DD)
reviewer: ""              # filled only by the human reviewer
reviewed_on: null         # date of the review (YYYY-MM-DD)
notes: []
steps: []                 # per ledger entry of the stage (latest per step): step, verify, verdict, ts, actor,
                          # evidence (one line), entry_sha256 (copied by b1500 bringup record, never edited)
