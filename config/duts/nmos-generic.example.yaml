# DUT profile (example; committed). Schema: b1500_test_agent.models.policy.DutProfile; name = file name.
# Generic enhancement-mode n-channel MOSFET; example values, not a real device. Per terminal: max |V| (V) and
# max |I| (A; also the largest compliance). A plan outside this envelope needs confirmation (dut_envelope, rule
# R-DUT-01). Nominal values: simulator example (scenario `nmos_basic`, whose truth differs on purpose: Vth 0.42 V,
# SS about 77 mV/dec), not real-device values and never measurements; replace or delete them in your own profile.

device_type: nmos
description: Generic n-channel MOSFET (example envelope).
terminals:
  gate:   {max_abs_v: 3.0, max_abs_i: 1.0e-3}
  drain:  {max_abs_v: 3.0, max_abs_i: 1.0e-3}
  source: {max_abs_v: 1.0, max_abs_i: 1.0e-3}
  bulk:   {max_abs_v: 1.0, max_abs_i: 1.0e-3}
nominal:
  # vth 0.5 V, ss 80 mV/dec: a generic silicon example used with the simulator (scenario `nmos_basic`), not the lab's
  # transistors: the only lab Id-Vg on record (lwp/matlab_B1500/IdVg_test_20251001_*.csv, device type not recorded;
  # asked in knowledge 01) shows about 210 mV/dec at Vd 0.1 V.
  vth: {value: 0.5, unit: V}
  ss: {value: 80.0, unit: mV/dec}
notes:
  - "Example use: Id-Vg in the linear region (Vd 0.05 V), Id-Vd up to Vd 3 V."
