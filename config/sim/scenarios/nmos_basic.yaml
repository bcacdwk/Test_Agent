# Simulator scenario (committed). Schema: b1500_test_agent.models.station.SimScenario; consumed by the simulator
# (WP1.2). Name = file name. The slots mirror config/station.example.yaml. `wiring` is the physical wiring of the
# simulated prober and is independent of the agent's pin map, so a wrong pin map behaves like mis-wiring.
# `models` holds the device truth parameters that tests compare extractions against.

description: Healthy n-channel MOSFET wired like pin map mosfet-4t; interlock open; instant timing.
idn: Keysight Technologies,B1500A,SIM0000001,A.06.01.2024.0101
slots:
  - {slot: 1, model: B1511B}
  - {slot: 2, model: B1511B}
  - {slot: 3, model: B1517A}
  - {slot: 4, model: B1517A}
  - {slot: 5, model: B1530A}
  - {slot: 6, model: B1525A}
  - {slot: 7, model: B1520A}
interlock_closed: false
wiring:
  dut:
    gate: 1
    drain: 3
    source: GNDU
    bulk: GNDU
models:
  dut:
    model: mosfet_ekv
    params:
      polarity: n
      vth0: 0.42                # V; truth for Vth extraction tests (deliberately not the DUT profile's nominal 0.5 V)
      slope_factor: 1.3         # subthreshold slope factor n (SS = n ln10 kT/q, about 77 mV/dec at 300 K)
      beta: 2.0e-3              # A/V^2 (mobility x Cox x W/L)
      theta: 0.2                # 1/V mobility degradation, so gm peaks
      lambda: 0.05              # 1/V channel-length modulation
      rs_ohm: 20.0              # series resistance
      gate_leak_s: 1.0e-12      # gate leakage conductance
      temperature_k: 300.0
noise:
  floor_a: {MPSMU: 1.0e-11, HRSMU: 1.0e-13}
  rel: 1.0e-3
  seed: 1
faults: null
timing: instant
