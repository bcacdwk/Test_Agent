# DUT profile (example; committed). Schema: b1500_test_agent.models.policy.DutProfile; name = file name.
# 100 pF reference capacitor (the known-capacitance check of bring-up stage L6 and of cmu.spot); terminals `a`/`b`
# like the other two-terminal examples. AC envelope for the MFCMU (R-CMU-01); a passive standard tolerates the full
# MFCMU AC range. Nominal values help choose parameters and are never measurements.

device_type: capacitor
description: 100 pF reference capacitor (example; MFCMU known-capacitance check).
terminals:
  a:
    max_abs_v: 10.0
    max_abs_i: 1.0e-3
    impedance: high_z
    ac: {max_vrms: 0.25}
  b:
    max_abs_v: 10.0
    max_abs_i: 1.0e-3
    impedance: high_z
    ac: {max_vrms: 0.25}
nominal:
  c: {value: 1.0e-10, unit: F}
  tolerance: {value: 0.01, unit: "1"}     # relative, i.e. 1 %
notes:
  - After phase compensation and open/short correction the MFCMU should read 100 pF within the standard's tolerance;
    uncorrected it reads the fixture parasitics too (about +0.3 pF).
