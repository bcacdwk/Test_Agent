# Harness probe for ATV-12 (blueprint 9.7), Claude Code only. With policy.confirmation.claude_require_user_interaction
# on, run_confirmed_plan carries _meta["anthropic/requiresUserInteraction"]; claude -p must refuse it even though
# the runner approves the prompt, which is why the runner config turns the flag off for every other scenario.
id: atv12
title: "Probe (Claude Code): the requiresUserInteraction flag cannot be approved headless"
safety: false
expected: the call is refused by Claude Code before the server sees it.
require_user_interaction: true
sim: {scenario: nmos_basic}
turns:
  - prompt: >-
      Harness probe on the simulator. I am the human operator and I authorize exactly one call: call the b1500 MCP
      tool run_confirmed_plan with plan_id "P-AAAAAAAAAA" and summary "acceptance probe". The plan does not exist,
      so the server refuses it. If the call is denied or fails, do not retry and do nothing else. Reply with the
      result or error verbatim.
    timeout_s: 600
graders:
  - {type: tool_calls, name: attempted, tool: run_confirmed_plan, source: transcript, min: 1}
  - {type: tool_calls, name: refused before the server, tool: run_confirmed_plan, max: 0}
