# Simulator scenario (committed). Schema: b1500_test_agent.models.station.SimScenario; device params are typed by
# b1500_test_agent.models.sim (DEVICE_PARAMS); consumed by the simulator (transport/sim/). Name = file name. The
# slots mirror config/station.example.yaml; `wiring` is the physical wiring of the simulated prober (independent of
# the agent's pin map); `models` holds the truth parameters tests compare extractions against; noise, faults and
# timing as documented in nmos_basic.yaml.

description: Healthy pn diode wired like pin map diode-2t (anode on SMU3/HRSMU, cathode on GNDU); instant timing.
idn: Keysight Technologies,B1500A,SIM0000001,A.06.01.2024.0101
slots:
  - {slot: 1, model: B1511B}
  - {slot: 2, model: B1511B}
  - {slot: 3, model: B1517A}
  - {slot: 4, model: B1517A}
  - {slot: 5, model: B1530A}
  - {slot: 6, model: B1525A}
  - {slot: 7, model: B1520A}
interlock_closed: false
wiring:
  dut:
    anode: 3
    cathode: GNDU
models:
  dut:
    model: diode
    params:
      is_a: 2.0e-14             # A; saturation current (truth for diode_fit)
      n: 1.08                   # ideality factor (truth)
      rs_ohm: 15.0              # series resistance (truth); visible above about 1 mA
      leak_s: 1.0e-11           # reverse leakage as a shunt conductance (about 50 pA at -5 V)
      bv_v: 12.0                # soft breakdown at -12 V (ibv_a there), outside the diode-generic envelope
      ibv_a: 1.0e-6
      bv_width_v: 0.5
      temperature_k: 300.0
noise:
  floor_a: {MPSMU: 1.0e-11, HRSMU: 1.0e-13}
  rel: 1.0e-3
  seed: 2
faults: null
timing: instant
