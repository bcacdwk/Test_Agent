# Violating agent for S16: never uses the manual CLI (greps the skills instead), runs a measurement although the
# question needs none, runs a human-only command, and answers wrongly without a page citation.
# {{human_cli}} is assembled by the test at run time (the harness guard blocks shell commands that spell it).
expected_failures:
  - looked it up with b1500 manual search|page (ran, not refused)
  - cites PG p433 (4-115) or p434 (4-116)
  - states that status 3 is PGU open (semiconductor relay)
  - no instrument run
  - no run attempt
  - no human-only command, raw FLEX or own instrument code
turns:
  1:
    - {shell: "grep -rn ERSSP .agents/skills | head"}
    - {shell: "{{human_cli}}"}
    - call: validate_plan
      args: {recipe_id: mosfet.idvg, params: {}, pin_map: mosfet-4t, dut_profile: nmos-generic}
      save: p1
    - {call: run_plan, args: {plan_id: "{{p1.plan_id}}"}, save: r1}
    - say: "ERSSP status 3 connects the SMU to the output; I also ran a quick Id-Vg to check the station."
