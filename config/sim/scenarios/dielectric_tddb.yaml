# Simulator scenario (committed). Schema: b1500_test_agent.models.station.SimScenario. Name = file name.
# A gate dielectric for time-dependent dielectric breakdown (blueprint v2 4.2 `dielectric`, 3.1 row
# reliability.tddb_cvs): 5 nm SiO2-like film, 100 um x 100 um, gate electrode on SMU4 (HRSMU), substrate on the GNDU:
# the gate and bulk of pin map mosfet-4t (a gate stack on the MOSFET landing; nothing is wired to the drain probe SMU3).
#
# Truth (tests/integration/test_recipes_sampling.py): Fowler-Nordheim leakage (about 2 uA at 5.5 V) plus stress-
# induced leakage growing with the damage; instantaneous breakdown at 12 MV/cm (BDV 6.0 V); under a constant stress V
# below BDV the device breaks at t_bd(V) = eta(V) x W^(1/beta), eta = 1e4 s x exp(-8/V x (V - 5 V)), Weibull beta 1.5,
# W the seeded unit-exponential draw of site 0 (seed 2: W = 0.527): t_bd = 119 s at 5.5 V, 6.5e3 s at 5.0 V,
# 3.6e5 s at 4.5 V. After breakdown a 1 kOhm path conducts (5.5 mA at 5.5 V), so a 1 mA compliance stops the
# sampling (MSC automatic abort). time_to_breakdown reports t_bd within one sampling interval. Every new site
# (DielectricDevice.next_site) draws a new W: a population for weibull_fit. Example values, not a measured film.

description: >-
  5 nm gate dielectric (BDV 6.0 V, Weibull beta 1.5, t_bd 119 s at 5.5 V) between SMU4 and the GNDU, wired as the
  gate and bulk of pin map mosfet-4t; instant timing.
idn: Agilent Technologies,B1500A,0,A.06.02.2023.0401
slots:                          # lab layout (config/station.example.yaml): SPGU 1, WGFMU 2, HRSMU 3-4, MPSMU 5-6, MFCMU 7
  - {slot: 1, model: B1525A}
  - {slot: 2, model: B1530A}
  - {slot: 3, model: B1517A}
  - {slot: 4, model: B1517A}
  - {slot: 5, model: B1511B}
  - {slot: 6, model: B1511B}
  - {slot: 7, model: B1520A}
interlock_closed: false
wiring:
  dut:
    top: 4                      # gate electrode
    bottom: GNDU                # substrate
models:
  dut:
    model: dielectric
    params:
      area_um2: 1.0e4
      tox_nm: 5.0
      eps_r: 3.9
      ebd_mv_cm: 12.0           # BDV = 6.0 V
      tbd_eta_s: 1.0e4          # characteristic life at tbd_v_ref
      tbd_v_ref: 5.0
      tbd_gamma_per_v: 8.0      # E-model acceleration
      weibull_beta: 1.5
      seed: 2
      site: 0
      silc_s: 1.0e-7            # stress-induced leakage at full damage
      r_bd_ohm: 1000.0
noise:
  floor_a: {MPSMU: 1.0e-11, HRSMU: 1.0e-13}
  rel: 1.0e-3
  seed: 22
faults: null
timing: instant
