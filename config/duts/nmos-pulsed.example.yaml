# DUT profile (example; committed). Schema: b1500_test_agent.models.policy.DutProfile; name = file name.
# Generic enhancement-mode n-channel MOSFET for SMU pulsed I-V (card smu-pulsed-iv, WP7.3): the DC envelope of
# nmos-generic plus pulse envelopes on gate and drain (R-PULSE-02: a pulse role on a terminal without one is blocked;
# outside it the plan needs confirmation, dut_envelope). Example values, not a real device: pulses up to the DC
# voltage, 2 s wide, duty 0.5, 100000 pulses per run. Per terminal: max |V| (V) and max |I| (A; also the largest
# compliance) for DC sourcing (R-DUT-01). Nominal values are typical numbers for choosing parameters, never
# measurements.

device_type: nmos
description: Generic n-channel MOSFET with gate and drain pulse envelopes (example; pulsed Id-Vg/Id-Vd and DC references).
terminals:
  gate:
    max_abs_v: 3.0
    max_abs_i: 1.0e-3
    pulse: {max_abs_v: 3.0, max_width_s: 2.0, max_duty: 0.5, max_count: 100000}
  drain:
    max_abs_v: 3.0
    max_abs_i: 1.0e-3
    pulse: {max_abs_v: 3.0, max_width_s: 2.0, max_duty: 0.5, max_count: 100000}
  source: {max_abs_v: 1.0, max_abs_i: 1.0e-3}
  bulk: {max_abs_v: 1.0, max_abs_i: 1.0e-3}
nominal:
  vth: {value: 0.5, unit: V}
  ss: {value: 80.0, unit: mV/dec}
notes:
  - "Pulsed Id-Vg/Id-Vd within the DC limits; the DC reference run of pulsed_vs_dc uses the same profile."
  - "A power or SOI device with other limits needs its own profile from the human (never invent one)."
