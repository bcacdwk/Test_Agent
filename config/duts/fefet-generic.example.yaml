# DUT profile (example; committed). Schema: b1500_test_agent.models.policy.DutProfile; name = file name.
# Generic ferroelectric FET (e.g. HfZrO gate stack); example values, not a real device. Per terminal: max |V| (V)
# and max |I| (A; also the largest compliance). A plan outside this envelope needs confirmation (dut_envelope,
# rule R-DUT-01). Nominal values are typical numbers for choosing parameters, never measurements.

device_type: fefet
description: Generic n-channel FeFET (example envelope).
terminals:
  gate:   {max_abs_v: 5.0, max_abs_i: 1.0e-3}
  drain:  {max_abs_v: 1.0, max_abs_i: 1.0e-3}
  source: {max_abs_v: 1.0, max_abs_i: 1.0e-3}
  bulk:   {max_abs_v: 1.0, max_abs_i: 1.0e-3}
nominal:
  vth: {value: 0.6, unit: V}
  memory_window: {value: 1.0, unit: V}
notes:
  - Program and erase pulses must be reviewed against film thickness and coercive field.
  - Read operations should use conservative SMU I-V settings.
