# DUT profile (example; committed). Schema: b1500_test_agent.models.policy.DutProfile; name = file name.
# Generic enhancement-mode n-channel MOSFET; example values, not a real device. Per terminal: max |V| (V) and
# max |I| (A; also the largest compliance). A plan outside this envelope needs confirmation (dut_envelope, rule
# R-DUT-01). Nominal values are typical numbers for choosing parameters, never measurements.

device_type: nmos
description: Generic n-channel MOSFET (example envelope).
terminals:
  gate:   {max_abs_v: 3.0, max_abs_i: 1.0e-3}
  drain:  {max_abs_v: 3.0, max_abs_i: 1.0e-3}
  source: {max_abs_v: 1.0, max_abs_i: 1.0e-3}
  bulk:   {max_abs_v: 1.0, max_abs_i: 1.0e-3}
nominal:
  vth: {value: 0.5, unit: V}
  ss: {value: 80.0, unit: mV/dec}
notes:
  - "Typical use: Id-Vg in the linear region (Vd 0.05 V), Id-Vd up to Vd 3 V."
