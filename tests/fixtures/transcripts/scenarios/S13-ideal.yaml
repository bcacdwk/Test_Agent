# Ideal agent for S13 (tests/acceptance/scenarios/S13-fecap-pund.yaml). fecap.pund does not exist yet (WGFMU work
# packages): its plan, run and analysis are forged with the real models (`forge`, forge.py). The plan needs
# confirmation (unverified RSU wiring), so it runs in turn 2; Pr and Ec come from the simulator's PUND truth. The
# analysis vocabulary has no charge-density or field unit yet (WP10.x adds them), so the fixture labels both "1".
turns:
  1:
    - {shell: "sed -n '1,80p' .agents/skills/b1500-test/cards/nvm/fecap-pund.md"}
    - forge: plan
      recipe_id: fecap.pund
      kind: wgfmu_waveform
      pin_map: fecap-wgfmu
      dut_profile: fecap-generic
      params: {v_max: [3.0, V], rise: [1.0e-6, s]}
      channels:
        201: {role: top, terminal: top, function: wgfmu, max_abs_v: 3.0, via: "RSU201.OUT:wgfmu"}
        202: {role: bottom, terminal: bottom, function: wgfmu, max_abs_v: 0.0, via: "RSU202.OUT:wgfmu"}
      routes_by_phase: {main: ["RSU201.OUT:wgfmu", "RSU202.OUT:wgfmu"]}
      findings:
        - {rule_id: R-ROUTE-02, severity: confirm, reason: unverified_topology, message: "RSU201/RSU202 wiring is unverified"}
      summary: "fecap.pund@1 | top=WGFMU201 via RSU201.OUT PUND +-3 V 1 us ramps; bottom=WGFMU202 via RSU202.OUT 0 V measure I | DUT fecap-generic | pins fecap-wgfmu | sim | R-ROUTE-02 unverified_topology"
      save: p1
    - say: |-
        SIMULATED. PUND needs your confirmation (RSU wiring unverified, R-ROUTE-02). Plan {{p1.plan_id}}:
        {{p1.summary}}
  2:
    - forge: run
      tool: run_confirmed_plan
      plan_id: "{{p1.plan_id}}"
      summary: "{{p1.summary}}"
      analyses:
        - {method: pund_loop, quantity: pr, unit: "1", window: [0.0, 3.0, V],
           truth: {sim_call: pund_truth, args: {v_max: $v_max}, key: pr_uc_cm2}}
        - {method: pund_loop, quantity: ec, unit: "1", window: [0.0, 3.0, V],
           truth: {sim_call: pund_truth, args: {v_max: $v_max}, key: ec_mv_cm}}
      save: r1
    - say: |-
        SIMULATED PUND run {{r1.run_id}}. Derived values (method pund_loop, window 0..3 V):
        Pr = {{r1.pr}} uC/cm2, Ec = {{r1.ec}} MV/cm.
