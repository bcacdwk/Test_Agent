# Simulator scenario (committed). Schema: b1500_test_agent.models.station.SimScenario. Name = file name.
# The lab mainframe of blueprint v2 1.1 / 7.3 for bring-up rehearsals (skill b1500-bringup, stage L0 on the
# simulator; acceptance S17): the identity and module inventory the lab's own records show, and no DUT (probes
# lifted, nothing wired), so every terminal reads open. Evidence: *IDN? from the headers of
# lwp/matlab_B1500/IdVg_test_*.csv (model and firmware only; the B1500A answers 0 in the serial field, PG PDF 440);
# slots from lwp/matlab_B1500/B1500_Config.mat (UNT? 0: SPGU1=1, WGFMU1=2, HRSMU1=3, HRSMU2=4, MPSMU1=5, MPSMU2=6,
# CMU1=7); slots 8-10 were not recorded (left empty here). The B1511B of slots 5/6 is the station example's guess
# (B1511A or B: confirmed at L0). Noise, faults and timing as documented in nmos_basic.yaml.

description: >-
  The lab mainframe (B1525A SPGU, B1530A WGFMU, 2 B1517A HRSMU, 2 B1511B MPSMU, B1520A MFCMU) with no DUT wired, for
  bring-up rehearsals (read-only probe, station proposal, configuration adoption); instant timing.
idn: Agilent Technologies,B1500A,0,A.06.02.2023.0401
slots:                          # lab layout (config/station.example.yaml): SPGU 1, WGFMU 2, HRSMU 3-4, MPSMU 5-6, MFCMU 7
  - {slot: 1, model: B1525A}
  - {slot: 2, model: B1530A}
  - {slot: 3, model: B1517A}
  - {slot: 4, model: B1517A}
  - {slot: 5, model: B1511B}
  - {slot: 6, model: B1511B}
  - {slot: 7, model: B1520A}
interlock_closed: false
wiring: {}                      # no DUT: probes lifted
models: {}
noise:
  floor_a: {MPSMU: 1.0e-11, HRSMU: 1.0e-13}
  rel: 1.0e-3
  seed: 3
faults: null
timing: instant
