# Golden FLEX strings of the SMU pulsed builders (src/b1500_test_agent/driver/flex/pulsed.py), WP7.3.
# Each case: the builder, its arguments, the exact string the builder writes (`expect`) and, where the Programming
# Guide prints an example with the same parameters, that example (`manual`) with its PDF page; the builder writes
# numbers in its own canonical form (shortest round-trip decimal, upper-case exponent), which must be numerically
# equal to the manual's. The builders always send the period (PT, MCPT) and the compliance (PV, PI, PWV, PWI,
# MCPNX, MCPWNX), so manual examples that omit them are cited without `manual`.
source: >-
  Keysight B1500 Series Programming Guide, Edition 15: MCPNT PDF 461-462, MCPNX PDF 462-463 (example PDF 464), MCPT
  PDF 464-465, MCPWS PDF 465, MCPWNX PDF 465-467 (example PDF 467), PI PDF 485-486 (example PDF 486), PT PDF 486-487,
  PV PDF 488-489 (example PDF 489), PWI PDF 490-491 (example PDF 491), PWV PDF 492-493 (example PDF 493) and the
  pulsed programming examples Tables 3-4, 3-8, 3-9, 3-14, 3-15 (PDF 196, 210, 214, 230, 234).
kind: builders
cases:
  - {builder: pt, args: [0.1, 0.01, 0.02], expect: "PT 0.1,0.01,0.02", manual: "PT 0.1,0.01,0.02", pdf: 196}
  - {builder: pt, args: [0, 5.0e-4, 0.005], expect: "PT 0,0.0005,0.005", pdf: 487}
  - {builder: pt, args: [0, 0.2, 0.21, 0.1], expect: "PT 0,0.2,0.21,0.1", pdf: 487}
  - {builder: pv, args: [1, 12, 0, 5, 1.0e-3], expect: "PV 1,12,0,5,0.001", manual: "PV 1,12,0,5,1E-3", pdf: 489}
  - {builder: pv, args: [2, 0, 0, 1, 0.01], expect: "PV 2,0,0,1,0.01", pdf: 196}
  - {builder: pi, args: [1, 16, 0, 5.0e-5, 5], expect: "PI 1,16,0,5E-05,5", manual: "PI 1,16,0,5E-5,5", pdf: 486}
  - {builder: pi, args: [2, 0, 0, 0.003, 5], expect: "PI 2,0,0,0.003,5", pdf: 214}
  - {builder: pwv, args: [2, 3, 14, 0, 1, 10, 100, 0.1], expect: "PWV 2,3,14,0,1,10,100,0.1",
     manual: "PWV 2,3,14,0,1,10,100,0.1", pdf: 493}
  - {builder: pwv, args: [3, 1, 0, 0, 0, 5, 11, 0.05], expect: "PWV 3,1,0,0,0,5,11,0.05", pdf: 210}
  - {builder: pwi, args: [2, 3, 13, 0, 1.0e-7, 1.0e-2, 100, 10], expect: "PWI 2,3,13,0,1E-07,0.01,100,10",
     manual: "PWI 2,3,13,0,1E-7,1E-2,100,10", pdf: 491}
  - {builder: mcpt, args: [0.1, 0.05, 0.01], expect: "MCPT 0.1,0.05,0.01", manual: "MCPT 0.1,0.05,0.01", pdf: 230}
  - {builder: mcpt, args: [1, 0.05, 0.02, 2], expect: "MCPT 1,0.05,0.02,2", pdf: 464}
  - {builder: mcpt, args: [0, 0.01], expect: "MCPT 0,0.01", pdf: 465}
  - {builder: mcpnt, args: [3, 0.01, 0.02], expect: "MCPNT 3,0.01,0.02", manual: "MCPNT 3,1E-2,2E-2", pdf: 464}
  - {builder: mcpnt, args: [2, 0, 0.005], expect: "MCPNT 2,0,0.005", pdf: 234}
  - {builder: mcpnx, args: [1, 3, "V", 0, 0, 5, 0.1], expect: "MCPNX 1,3,1,0,0,5,0.1", manual: "MCPNX 1,3,1,0,0,5,1E-1",
     pdf: 464}
  - {builder: mcpnx, args: [2, 3, "I", 15, 0, 1.0e-5, 2], expect: "MCPNX 2,3,2,15,0,1E-05,2", pdf: 463}
  - {builder: mcpws, args: [1, 101], expect: "MCPWS 1,101", manual: "MCPWS 1,101", pdf: 467}
  - {builder: mcpwnx, args: [2, 4, "V", 0, 0, 0, 5, 0.1], expect: "MCPWNX 2,4,1,0,0,0,5,0.1",
     manual: "MCPWNX 2,4,1,0,0,0,5,1E-1", pdf: 467}
  - {builder: mcpwnx, args: [1, 2, "V", 0, 0, 0.1, 0.9, 0.1], expect: "MCPWNX 1,2,1,0,0,0.1,0.9,0.1", pdf: 234}
