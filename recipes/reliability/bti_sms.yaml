# Recipe (registry source; schema b1500_test_agent.models.recipe.Recipe; checked by `b1500 dev recipe-check`).
# Bias temperature instability, stress-measure-stress (BTI SMS): the gate is stressed at vg_stress (drain, source and
# bulk at 0 V) and interrupted for a read at log-spaced (or listed) cumulative stress times: an Id-Vg sweep at the
# small drain bias vd (read_kind staircase, the default; Vth per read) or spot Id at vg_read, vd (read_kind spot). A
# reference read precedes the stress; with recovery_time > 0 the gate then rests at vg_recovery and is read at
# log-spaced recovery times. The stress is timed by the instrument (25 s sampling blocks, one gate/drain current
# monitor sample each: the gate leakage under stress), so the simulator ages the device exactly as long. Every hold
# block and every read is a checkpoint (async progress, safe_shutdown cancels); runs longer than max_sync_run_s are
# asynchronous, longer than long_run_confirm_s confirmed (long_run). DESTRUCTIVE (the shift is permanent in part):
# every plan needs confirmation. Analysis: bti_power_law (dVth = A t^n, constant-current Vth; recovery fraction).
# Implements the reserved id reliability.bti_sms (blueprint v2 3.1); the WGFMU fast BTI is wgfmu.fast_bti (M10).
# status: sim_validated by tests/integration/test_recipes_stress.py (nmos_bti: n +-0.02, A +-10 % vs the model truth);
# hw_validated only through a validation record (stage L9).
id: reliability.bti_sms
version: 1
title: BTI stress-measure-stress (gate stress, Id-Vg reads at log times, optional recovery; destructive)
family: reliability
kind: stress_measure
status: sim_validated
card: .agents/skills/b1500-test/cards/reliability/bti-stress-measure.md
device_types: [nmos, pmos, igzo_tft]
roles:
  gate:
    function: sweep_v
    measure: [I]
    module_types: [MPSMU, HRSMU, HPSMU]
    settings: {start: $vg_start, stop: $vg_stop, points: $vg_points, v: $vg_read, icomp: $icomp_gate,
               stress: $vg_stress, recovery: $vg_recovery}
  drain:
    function: bias_v
    measure: [I]
    module_types: [MPSMU, HRSMU, HPSMU]
    prefer: HRSMU
    settings: {v: $vd, icomp: $icomp_drain, stress: $vd_stress, recovery: 0.0}
  source: {function: ground, allow_gndu: true}
  bulk: {function: ground, allow_gndu: true, optional: true}
params:
  vg_stress: {unit: V, range: [-10, 10],
              doc: "Gate stress voltage (required; positive: nMOS PBTI, negative: pMOS NBTI)."}
  stress_time: {unit: s, default: 1000.0, recommended: [100.0, 10000.0], range: [0.1, 86400.0],
                doc: "Total stress time (the last read)."}
  schedule: {type: enum, choices: [log, list], default: log,
             doc: "log: reads at first_read x 10^(k/reads_per_decade) and at stress_time; list: at read_times."}
  first_read: {unit: s, default: 1.0, recommended: [0.1, 10.0], range: [0.02, 3600.0],
               doc: "First read after this much stress (also the first recovery read)."}
  reads_per_decade: {type: int, default: 3, recommended: [2, 5], range: [1, 20], doc: Log schedule density.}
  read_times: {type: float_list, unit: s, default: [1.0, 10.0, 100.0, 1000.0], range: [0.02, 86400.0],
               doc: "Cumulative stress times of the reads when schedule is list (ignored for log)."}
  recovery_time: {unit: s, default: 0.0, recommended: [0.0, 3600.0], range: [0.0, 86400.0],
                  doc: "Recovery after the stress, read at log times (0 = no recovery)."}
  vg_recovery: {unit: V, default: 0.0, range: [-10, 10], doc: Gate level during the recovery.}
  read_kind: {type: enum, choices: [staircase, spot], default: staircase,
              doc: "staircase: Id-Vg per read (Vth); spot: Id at vg_read, vd (faster, less recovery)."}
  vg_start: {unit: V, default: -0.2, recommended: [-1, 0], range: [-10, 10], doc: Read sweep start.}
  vg_stop: {unit: V, default: 1.5, recommended: [1, 3], range: [-10, 10], doc: Read sweep stop.}
  vg_points: {type: int, default: 35, recommended: [21, 61], range: [11, 401],
              doc: "Read sweep points (few points = a short read = less recovery during it)."}
  vg_read: {unit: V, default: 1.0, range: [-10, 10], doc: Gate level of a spot read.}
  vd: {unit: V, default: 0.05, recommended: [0.02, 0.1], range: [-5, 5], doc: Drain bias of the reads (linear region).}
  vd_stress: {unit: V, default: 0.0, range: [-5, 5], doc: "Drain during the stress (0 V for BTI; HCI is reliability.hci)."}
  icomp_gate: {unit: A, default: 1.0e-6, range: [1.0e-12, 1.0e-3],
               doc: "Gate current compliance in every phase (a breakdown under stress stops the run)."}
  icomp_drain: {unit: A, default: 1.0e-3, range: [1.0e-12, 1.0e-2], doc: Drain current compliance.}
  samples: {type: int, default: 1, range: [1, 100], doc: Spot measurements per spot read (averaged).}
  integration:
    type: enum
    choices: [short, medium, long]
    default: medium
    doc: ADC preset of the reads (the monitor samples shorten it to 20 ms).
quality: {limited: [C, T], untrusted: [V, X, F, D, G, S, U], max_limited_fraction_in_fit: 0.05}
analysis_defaults:
  - {method: bti_power_law, options: {vth_method: constant_current}}
always_confirm: [destructive]
provenance:
  sources:
    - blueprint v2 3.1 row reliability.bti_sms, 2.7 kind stress_measure and catalog/blocks.py, 4.2 mosfet + bti
    - deck slide 14 and text (BTI log-spaced read times); knowledge 05 (BTI stress-measure-stress)
    - Kaczer et al., IRPS 2008 (power-law BTI, recovery); JEDEC JEP-series BTI practice (TODO(verify))
    - Programming Guide Ed. 15 MT (PDF 474-476), MSC (PDF 472-473), WV (PDF 568-569), DV (PDF 396)
  validation_runs: []
