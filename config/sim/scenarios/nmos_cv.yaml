# Simulator scenario (committed). Schema: b1500_test_agent.models.station.SimScenario; device params are typed by
# b1500_test_agent.models.sim (DEVICE_PARAMS); consumed by the simulator (transport/sim/). Name = file name.
# A large-area n-channel MOSFET with interface traps on the lab mainframe (blueprint v2 3.3 mosfet.charge_pumping,
# 4.2 `mosfet` +cv, 4.4), landed as pin map mosfet-cp: the gate pad on output 1 of the first 16440A selector (ERSSP
# port 0 = station SEL1.OUT1: SMU 3 on its SMU input for DC gate bias, SPGU channel 101 on its PGU input for the gate
# pulse train), the bulk (substrate contact) on HRSMU 4 for the charge-pumping current, drain and source on MPSMU 5
# and 6 directly (held at the reverse bias, 0 V by default). Selector port 0/1 cabling is the rehearsal assumption of
# lab_station.yaml; ports 2/3 (SEL2) have no input cabled here because MPSMU 5/6 land directly on the drain and
# source (the real wiring is recorded at bring-up L7).
#
# Truth (tests/integration/test_recipes_charge_pumping.py asserts the default analysis against it;
# Mosfet.charge_pumping_truth): W/L = 100/10 um (gate area 1e-5 cm2), 10 nm oxide on 1e17 cm-3 p substrate
# (Vfb = vth0 - 2phiB - body term = -0.62 V), Vth 0.7 V, mean interface-trap density 5e10 cm-2 eV-1, capture cross
# section 1e-16 cm2. A gate train -2 V -> +2 V with 100 ns edges pumps Icp = q f A Dit dE with dE = 0.77 eV: 0.62 nA
# at 10 kHz, 6.2 nA at 100 kHz, 62 nA at 1 MHz (Qcp = Icp/f = 6.2e-14 C per cycle), out of the bulk (the bulk SMU
# reads +Icp, source and drain share -Icp). The base-level curve (3 V amplitude) has its plateau for bases between
# about -2.3 V and -0.9 V. Target (blueprint v2 10.5 WP9.3): Icp proportional to f within +-10 % of the model.
# Device values are typical of a test MOSFET, not a measured device (TODO(verify) M12 per device). Noise as
# nmos_basic.yaml (HRSMU floor 1e-13 A, 0.1 % relative).
#
# Split C-V (blueprint v2 3.2 mosfet.cgc_cv, mosfet.cgd_cv; 4.2 `mosfet` +cv; WP8.3): a second transistor of the same
# technology on the die, `cv`, is landed on the MFCMU (pin map mosfet-split-cv): gate on the High side (7H), drain on
# the Low side (7L), sharing the source pad (MPSMU 6) and the substrate (HRSMU 4) with `dut`, behind the measurement
# path parasitics of the `fixture` device `path` (as in capacitor_100p). With SMU6 off its source floats
# (mosfet.cgc_cv: the whole channel charge returns through the drain, Cgc), with SMU6 at 0 V it is AC ground
# (mosfet.cgd_cv: the drain half, Cgd). Truth (Mosfet.cv_truth): Cox*W*L = 3.453 pF (10 nm SiO2, W 100 um, L 10 um),
# overlap 20 fF per edge, Vth 0.7 V; Cgd in strong inversion about Cox*W*L/2 + 20 fF. Neither device sees the other's
# measurement: only `cv` has terminals on the MFCMU sides, only `dut` on the selector.

description: >-
  Large n-channel MOSFET (W/L 100/10 um, Dit 5e10 cm-2 eV-1) with the gate behind selector SEL1 (port 0: SMU 3 /
  SPGU 101), bulk HRSMU4, drain MPSMU5, source MPSMU6, on the lab mainframe; a second transistor of the same
  technology on the MFCMU (gate 7H, drain 7L, shared source SMU6 and substrate SMU4) for split C-V; instant timing.
idn: Agilent Technologies,B1500A,0,A.06.02.2023.0401
slots:                          # lab layout (config/station.example.yaml): SPGU 1, WGFMU 2, HRSMU 3-4, MPSMU 5-6, MFCMU 7
  - {slot: 1, model: B1525A}
  - {slot: 2, model: B1530A}
  - {slot: 3, model: B1517A}
  - {slot: 4, model: B1517A}
  - {slot: 5, model: B1511B}
  - {slot: 6, model: B1511B}
  - {slot: 7, model: B1520A}
interlock_closed: false
selectors:                      # 16440A cabling: ERSSP port -> SMU Force on the SMU input, SPGU channel on the PGU input
  0: {smu: 3, pgu: 101}         # SEL1.OUT1 (CH 1): the MOSFET gate
  1: {smu: null, pgu: 102}      # SEL1.OUT2 (CH 2): nothing landed
wiring:
  dut:
    gate: SELPORT0
    drain: 5
    source: 6
    bulk: 4
  cv:                           # the split C-V transistor (WP8.3), pin map mosfet-split-cv
    gate: 7H
    drain: 7L
    source: 6                   # shared source pad: floating while SMU6 is off (Cgc), AC ground at 0 V (Cgd)
    bulk: 4                     # common substrate
  path:
    high: 7H
    low: 7L
models:
  dut:
    model: mosfet
    params:
      polarity: n
      vth0: 0.7                 # V
      slope_factor: 1.3
      beta: 1.4e-3              # A/V^2 (mu Cox W/L with W/L = 10)
      theta: 0.2
      lambda: 0.02
      rs_ohm: 20.0
      gate_leak_s: 1.0e-13
      temperature_k: 300.0
      w_um: 100.0
      l_um: 10.0
      tox_nm: 10.0
      nsub_cm3: 1.0e17
      cov_f_per_m: 2.0e-10      # gate-overlap capacitance per edge (F/m of width)
      dit_cm2_ev: 5.0e10        # mean interface-trap density swept by charge pumping
      cp_sigma_cm2: 1.0e-16
      cp_edge_v: 0.1
  cv:
    model: mosfet
    params:                     # same technology as dut (no interface traps: split C-V truth stays ideal)
      polarity: n
      vth0: 0.7                 # V; truth of cv_vth (split C-V onset)
      slope_factor: 1.3
      beta: 1.4e-3
      theta: 0.2
      lambda: 0.02
      rs_ohm: 20.0
      gate_leak_s: 1.0e-13
      temperature_k: 300.0
      w_um: 100.0
      l_um: 10.0
      tox_nm: 10.0              # Cox*W*L = 3.453 pF: truth of the Cgc plateau (+-2 %)
      nsub_cm3: 1.0e17
      cov_f_per_m: 2.0e-10      # 20 fF overlap per edge (the Cgc floor)
  path:
    model: fixture
    params: {}                  # blueprint 4.2 defaults (models.sim_devices.FixtureParams); TODO(verify) at M12 L6
noise:
  floor_a: {MPSMU: 1.0e-11, HRSMU: 1.0e-13}
  rel: 1.0e-3
  seed: 11
faults: null
timing: instant
