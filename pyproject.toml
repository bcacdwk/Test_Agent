[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b1500-test-agent"
version = "0.1.0"
description = "Safety-gated Keysight B1500A measurement kernel with a 10-tool MCP server, CLI and agent skills."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
  { name = "bcacdwk", email = "17078434@qq.com" }
]
dependencies = [
  "fastmcp>=4,<5",
  "filelock",
  "matplotlib",
  "numpy",
  "pandas",
  "pydantic>=2",
  "pypdfium2>=5.15.2",
  "pyvisa",
  "pyyaml",
  "typer",
]

[project.scripts]
b1500 = "b1500_test_agent.adapters.cli:main"
b1500-mcp = "b1500_test_agent.adapters.mcp_server:main"

[dependency-groups]
# `uv sync` installs the `dev` group by default.
dev = [
  "hypothesis",
  "pytest",
  "pytest-xdist",
  "pyvisa-sim",
  "ruff",
  "tiktoken",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Ruff's default rule set (pinned through uv.lock) plus line length.
extend-select = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "hardware: needs a real B1500A over VISA (lab PC, owner present); read-only probe and record checks of tests/hardware/; skipped unless B1500_HW=1 and backend visa",
  "hw_s0: hardware test of bring-up stage S0 (physical prerequisites)",
  "hw_l0: hardware test of bring-up stage L0 (probe and configuration)",
  "hw_l1: hardware test of bring-up stage L1 (SMU zero, cleanup verification)",
  "hw_l2: hardware test of bring-up stage L2 (resistors)",
  "hw_l3: hardware test of bring-up stage L3 (diode)",
  "hw_l4: hardware test of bring-up stage L4 (MOSFET)",
  "hw_l5: hardware test of bring-up stage L5 (SMU advanced)",
  "hw_l6: hardware test of bring-up stage L6 (CMU)",
  "hw_l7: hardware test of bring-up stage L7 (SPGU and selector)",
  "hw_l8: hardware test of bring-up stage L8 (WGFMU)",
  "hw_l9: hardware test of bring-up stage L9 (long runs)",
  "hw_l10: hardware test of bring-up stage L10 (harness and handoff)",
  "acceptance: M3 harness acceptance scenarios (Codex / Claude Code); run explicitly",
  "manuals: manual corpus, search and citation lint (blueprint 5; fixtures, no PDF needed)",
  "smu: SMU family (HRSMU/MPSMU + GNDU: kinds, recipes, analyses, compact models, cards, stages; blueprint v2 8.1 family marker)",
  "cmu: MFCMU family (+SCUU, QSCV and GNDU work of M8: builders, driver, simulator, corrections, kinds, recipes, analyses, safety, visa-loop; blueprint v2 8.1 family marker)",
  "spgu: HV-SPGU + 16440A family (builders, driver, simulator, cleanup step 2, selector routes, pulse kinds, recipes, analyses, safety, visa-loop, stage L7, ledger; blueprint v2 8.1 family marker)",
  "wgfmu: WGFMU instrument library, simulator and recipes (blueprint v2 8.1 family marker)",
  "wall_clock: asserts a wall-clock bound of the plan (e.g. a 4 h instant run < 2 s); CI runs these alone",
]
