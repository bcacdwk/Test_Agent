# Simulator scenario (committed). Schema: b1500_test_agent.models.station.SimScenario; device params are typed by
# b1500_test_agent.models.sim (DEVICE_PARAMS); consumed by the simulator (transport/sim/). Name = file name. The
# slots mirror config/station.example.yaml; `wiring` is the physical wiring of the simulated prober (independent of
# the agent's pin map); `models` holds the truth parameters tests compare extractions against; noise, faults and
# timing as documented in nmos_basic.yaml.

description: >-
  1 Ohm resistor wired like pin map resistor-4w (a on SMU3/HRSMU, b on GNDU), 0.5 Ohm force-path resistance per
  terminal (cable, probe, contact) and both Sense lines landed at the pads (Kelvin); instant timing.
idn: Keysight Technologies,B1500A,SIM0000001,A.06.01.2024.0101
slots:                          # lab layout (config/station.example.yaml): SPGU 1, WGFMU 2, HRSMU 3-4, MPSMU 5-6, MFCMU 7
  - {slot: 1, model: B1525A}
  - {slot: 2, model: B1530A}
  - {slot: 3, model: B1517A}
  - {slot: 4, model: B1517A}
  - {slot: 5, model: B1511B}
  - {slot: 6, model: B1511B}
  - {slot: 7, model: B1520A}
interlock_closed: false
wiring:
  dut:
    a: 3
    b: GNDU
models:
  dut:
    model: resistor
    params:
      r_ohm: 1.0                # truth of the four-wire resistance (kelvin_resistance +-0.5 %)
      lead_ohm: 0.5             # each force path; a two-wire reading sees r_ohm + 2 x lead_ohm = 2 Ohm
      kelvin: both              # Sense landed on both pads: the channels regulate and measure at the pads
noise:
  floor_a: {MPSMU: 1.0e-11, HRSMU: 1.0e-13}
  rel: 1.0e-3                   # also the relative noise of a current source's voltage reading
  seed: 11
faults: null
timing: instant
