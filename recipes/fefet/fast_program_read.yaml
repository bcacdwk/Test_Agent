# Recipe (registry source; schema b1500_test_agent.models.recipe.Recipe; checked by `b1500 dev recipe-check`).
# FeFET microsecond program and fast read (card nvm/fefet-pulse-write-read, bring-up stage L8; blueprint v2 3.4):
# kind wgfmu_waveform, builder program_read (catalog/ferro_waveforms.py). The gate (WGFMU 201 through RSU201, Fast IV)
# and the drain (WGFMU 202 through RSU202, current on `irange`) run ONE sequencer program: per cycle the erase pulse
# (v_erase, `width` flat, `t_edge` edges, rest of `period` at 0 V), a fast Id-Vg read (the gate steps vg_start ->
# vg_stop in vg_points levels, `read_edge` between them, `read_width` flat, each point averaged after `read_settle`;
# the drain at vd during the read, 0 V during the pulses), then the program pulse and the same read; a reference read
# before the first pulse. The read follows its pulse after the rest of the period only (microseconds), where an SMU
# read takes about a second (fefet.pulse_write_read): fast reads see the state before it relaxes. Cycles repeat the
# block (one pattern repeated by the sequence count). The WGFMU has no compliance: a drain current at the full scale
# of `irange` reads status V. Default analysis memory_window_pulse: MW = Vth(after erase) - Vth(after program) by
# the constant-current method (rows: cycle, phase read/erase/program, gate_V, drain_I).
# status: sim_validated by tests/integration/test_recipes_pund.py (fefet_lab device `wg`: MW within 10 % of the
# model truth memory_window_truth(v_program, v_erase, width)); hw_validated only through a validation record (L8).
id: fefet.fast_program_read
version: 1
title: FeFET microsecond program/erase pulses and fast Id-Vg reads through the WGFMU (one sequencer run), MW
family: nvm
kind: wgfmu_waveform
status: sim_validated
card: .agents/skills/b1500-test/cards/nvm/fefet-pulse-write-read.md
device_types: [fefet]
roles:
  gate:
    function: wgfmu
    module_types: [WGFMU]
    settings: {program: $v_program, erase: $v_erase, base: 0.0, width: $width, lead: $t_edge, trail: $t_edge,
               start: $vg_start, stop: $vg_stop, points: $vg_points}
  drain:
    function: wgfmu
    measure: [I]
    module_types: [WGFMU]
    settings: {v: $vd, pulse_bias: 0.0, range: $irange}
  source: {function: ground, allow_gndu: true}
params:
  builder: {type: enum, choices: [program_read], default: program_read, doc: Fixed waveform builder.}
  v_program: {unit: V, default: 4.0, range: [-10.0, 10.0],
              doc: "Program pulse amplitude at the gate (n-FeFET: positive, lowers Vth): example default for the
                simulator FeFET (scenario fefet_lab), not a real-device value; from the request or the DUT
                profile, else ask."}
  v_erase: {unit: V, default: -4.0, range: [-10.0, 10.0],
            doc: "Erase pulse amplitude at the gate (n-FeFET: negative, raises Vth): example default (simulator
              FeFET); from the request or the DUT profile, else ask."}
  width: {unit: s, default: 1.0e-6, range: [1.0e-8, 1.0e-3],
          doc: "Flat time of the program and erase pulses: example default (simulator FeFET); from the request or
            the DUT profile, else ask. WGFMU minimum pulse width 100 ns in PG mode, 300 ns in Fast IV mode
            (WG p16 (1-4))."}
  period: {unit: s, default: 1.0e-5, recommended: [1.0e-6, 1.0e-3], range: [2.0e-8, 1.0],
           doc: "Pulse period (> 2 t_edge + width): its rest at 0 V is the wait before the read."}
  count: {type: int, default: 1, recommended: [1, 10], range: [1, 100], doc: Pulses per operation.}
  t_edge: {unit: s, default: 1.0e-7, recommended: [7.0e-8, 1.0e-6], range: [1.0e-8, 1.0e-4],
           doc: "Leading and trailing time of the pulses."}
  sequence: {type: enum, choices: [erase_program, program_erase], default: erase_program,
             doc: "Operations of one cycle, each followed by a read."}
  cycles: {type: int, default: 1, recommended: [1, 5], range: [1, 50], doc: Repetitions of the sequence.}
  initial_read: {type: bool, default: true, doc: A reference read before the first pulse.}
  vg_start: {unit: V, default: -0.5, range: [-5.0, 5.0],
             doc: "Read sweep start (below your programmed Vth): example default; from the request or the DUT
              profile, else ask."}
  vg_stop: {unit: V, default: 1.8, range: [-5.0, 5.0],
            doc: "Read sweep stop: must stay below YOUR device's Vc (from the request or the DUT profile; else ask);
              1.8 V suits the simulator FeFET (Vc 2.8 V, scenarios fefet_basic/fefet_lab)."}
  vg_points: {type: int, default: 47, recommended: [31, 101], range: [11, 401], doc: Read sweep points.}
  vd: {unit: V, default: 0.05, recommended: [0.02, 0.1], range: [-1.0, 1.0], doc: Drain read bias (linear region).}
  irange: {type: enum, choices: [1ua, 10ua, 100ua, 1ma, 10ma], default: 100ua,
           doc: "Drain current range (full scale; no compliance: above it reads saturate, status V)."}
  read_edge: {unit: s, default: 1.0e-7, recommended: [7.0e-8, 1.0e-6], range: [1.0e-8, 1.0e-4],
              doc: Time between two read levels.}
  read_width: {unit: s, default: 1.0e-6, recommended: [5.0e-7, 1.0e-5], range: [2.0e-8, 1.0e-2],
               doc: Flat time of each read level.}
  read_settle: {unit: s, default: 5.0e-7, recommended: [1.0e-7, 5.0e-6], range: [0.0, 1.0e-2],
                doc: "Left out of each read level's average (read_width - read_settle is averaged)."}
quality: {limited: [C, T], untrusted: [V, X, F, D, G, S, U], max_limited_fraction_in_fit: 0.05}
analysis_defaults:
  - {method: memory_window_pulse, options: {vth_method: constant_current, i_crit_a: 1.0e-7}}
provenance:
  sources:
    - blueprint v2 2.7.1 (builder program_read), 2.10 (nvm.py memory_window_pulse), 3.4 (fefet.fast_program_read), 4.2 ferro FeFET target (MW from pulses +-10 %)
    - Keysight application note 5990-3636CHCN, 1 us flash-cell I-V with the B1530A, AN-FIV p5-6 (program pulse, then a
      fast read; drain current sampled during and after the program pulse)
    - WGFMU guide Ed. 8 setMeasureEvent (PDF 125-126), addSequence (PDF 80), Fast IV ranges (PDF 123, 142)
  validation_runs: []
