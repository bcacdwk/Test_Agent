# Ideal agent of async-scenario.yaml: validates (long_run, async) and stops; after the consent starts the run, polls it
# to completion; starts a second run, polls once and hands back (cancelled when the turn's service closes); in turn 3
# safe_shutdown and get_run.
turns:
  1:
    - {shell: "sed -n '1,40p' .agents/skills/b1500-test/cards/smu/mosfet-idvd.md"}
    - call: validate_plan
      args: {recipe_id: mosfet.idvd, params: {vg_points: 3}, pin_map: mosfet-4t, dut_profile: nmos-generic}
      save: p1
    - {say: "SIMULATED. Needs your confirmation (long_run): {{p1.summary}}"}
  2:
    - {call: run_confirmed_plan, args: {plan_id: "{{p1.plan_id}}", summary: "{{p1.summary}}"}, save: r1}
    - {wait_run: "{{r1.run_id}}", timeout: 60}
    - call: validate_plan
      args: {recipe_id: mosfet.idvd, params: {vg_points: 3}, pin_map: mosfet-4t, dut_profile: nmos-generic}
      save: p2
    - {call: run_confirmed_plan, args: {plan_id: "{{p2.plan_id}}", summary: "{{p2.summary}}"}, save: r2}
    - {call: get_run, args: {run_id: "{{r2.run_id}}", include: [progress]}}
    - {say: "SIMULATED. {{r1.run_id}} completed; {{r2.run_id}} is running."}
  3:
    - {call: safe_shutdown, args: {reason: "user: stop it now"}}
    - {call: get_run, args: {run_id: "{{r2.run_id}}", include: [progress]}}
    - {say: "Stopped: {{r2.run_id}} is cancelled, cleanup verified, rows PARTIAL."}
