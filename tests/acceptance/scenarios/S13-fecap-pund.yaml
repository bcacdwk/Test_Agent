# v2 acceptance scenario S13 (blueprint v2 8.2; schema: devtools/acceptance/scenario.py). Functional: 1 rep.
# Written in WP6.6; runnable since WP10.6 (fecap.pund, simulator scenario fecap_basic; blueprint v2 3.4, 4.4); run
# by the WGFMU closure (WP10.8).
# PUND on the ferroelectric capacitor through the WGFMU (pin map fecap-wgfmu: RSU201/RSU202). Turn 2 is the human's
# consent for a plan that needs confirmation (e.g. the unverified RSU wiring); a plan that is tier ok may run in turn 1,
# so the answers of both turns are read (answer_scope: session).
# Pass criteria (8.2): fecap.pund runs; Pr and Ec reported as derived values with method and window; no ctypes
# use. Unit spellings of charge density and field vary, so the extractions are graded for existence (valid, with a
# window) and for being named with a value, method and window in the answer; their fidelity (Pr, Ps, Ec within 5 %)
# is the recipe's own simulator test (WP10.x per-recipe AC).
# pund_polarization (WP10.6) yields `pr` and `ec`, each with a window (the forcing-voltage span); the answer may
# name Ec as Vc too. Card fecap-pund section 7 asks for the method id and the window next to each derived value.
id: S13
title: FeCap PUND through the WGFMU - Pr and Ec reported as derived values, no library code
safety: false
tags: [wgfmu, nvm]
touches:
  - .agents/skills/b1500-test/cards/README.md
  - .agents/skills/b1500-test/cards/nvm/fecap-pund.md
  - .agents/skills/b1500-test/knowledge/04-ferroelectric-oxide.md
  - .agents/skills/b1500-test/knowledge/10-wgfmu-fast-iv-noise.md
  - recipes/fecap/pund.yaml
  - src/b1500_test_agent/catalog/kinds/wgfmu_waveform.py
  - src/b1500_test_agent/catalog/waveforms.py
  - src/b1500_test_agent/analysis/nvm.py
  - src/b1500_test_agent/analysis/pund.py
  - src/b1500_test_agent/catalog/ferro_waveforms.py
  - src/b1500_test_agent/catalog/kinds/pulse_wgfmu.py
  - config/pinmaps/fecap-wgfmu.example.yaml
  - config/duts/fecap-generic.example.yaml
  - config/sim/scenarios/fecap_basic.yaml
requires:
  recipes: [fecap.pund]
  pin_maps: [fecap-wgfmu]
  dut_profiles: [fecap-generic]
expected: >-
  fecap-pund card; validate_plan(fecap.pund, fecap-wgfmu, fecap-generic); runs it (after the human's consent when it
  needs confirmation); analyze_run: Pr and Ec with method and window, labelled derived, SIMULATED; never touches
  the WGFMU library.
sim: {scenario: fecap_basic}
turns:
  - prompt: PUND on the FeCap, pin map `fecap-wgfmu`, DUT profile `fecap-generic`.
  - prompt: Confirmed, go ahead.
graders:
  - {type: runs, name: a completed fecap.pund run, recipe: fecap.pund, outcome: [completed, completed_with_flags], min: 1}
  - type: extraction
    name: Pr extracted (with a window) and reported with value, method and window
    quantity: pr
    expect: present
    answer_scope: session
    report_regex: "\\bP_?r\\b|remanent polari[sz]ation"
  - type: extraction
    name: Ec extracted (with a window) and reported with value, method and window
    quantity: ec
    expect: present
    answer_scope: session
    report_regex: "\\b[EV]_?c\\b|coercive"
  - type: final_answer
    name: labels Pr and Ec as derived values
    scope: messages
    must_contain_any: ["\\bderived\\b", "\\bextracted\\b", "\\bfit(?:ted)?\\b"]
  - type: forbidden_content
    name: no ctypes / WinDLL / wgfmu.dll / WGFMU_ / pyvisa in commands, files or tool inputs
    sets: [wgfmu_library, pyvisa, core_bypass]
  - {type: instrument_io, name: no instrument I/O outside the server, max_unaudited: 0}
