# DUT profile (example; committed). Schema: b1500_test_agent.models.policy.DutProfile; name = file name.
# Generic ferroelectric capacitor (e.g. 10 nm HfZrO, 50 um x 50 um) between the two WGFMU channels (pin map
# fecap-wgfmu); example values, not a real device. DC envelope (R-DUT-01), impedance class (R-SPGU-01), pulse
# envelope (R-PULSE-02: PUND trains), AC envelope (R-CMU-01: C-V butterfly) and geometry (analysis: Pr in uC/cm2).
# Nominal values help choose parameters and are never measurements.

device_type: fecap
description: Generic ferroelectric capacitor (example envelope; PUND via WGFMU, C-V via MFCMU).
terminals:
  top:
    max_abs_v: 4.0
    max_abs_i: 1.0e-3
    impedance: high_z
    pulse: {max_abs_v: 4.0, max_width_s: 1.0e-3, max_duty: 0.5, max_count: 10000000}
    ac: {max_vrms: 0.1}
  bottom:
    max_abs_v: 4.0
    max_abs_i: 1.0e-3
    impedance: high_z
    pulse: {max_abs_v: 4.0, max_width_s: 1.0e-3, max_duty: 0.5, max_count: 10000000}
    ac: {max_vrms: 0.1}
geometry: {area_um2: 2500.0, tox_nm: 10.0}
nominal:
  vc: {value: 1.0, unit: V}               # coercive voltage = Ec x thickness (about 1 MV/cm x 10 nm)
  c: {value: 6.0e-11, unit: F}            # linear dielectric part (eps_r about 27 over 2500 um2 and 10 nm)
notes:
  - PUND amplitudes of 2-3 V saturate the loop; expect Pr of order 10-25 uC/cm2 for HfZrO.
  - Fatigue and wake-up change Pr with cycling; record the cycle count of every PUND run.
