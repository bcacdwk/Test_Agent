# Ideal agent for S17 (tests/acceptance/scenarios/S17-bringup-rehearsal.yaml): loads b1500-bringup, reads each stage
# file before acting, works the steps `bringup next` names and records them with `bringup done`, several per call where
# `next` shows a batch (WP21.14: 7 `done` calls for the 30 entries; the human's steps with the human's own words,
# after the human's turn, one quote of the confirming message for the steps it covers), hands the S0 and L0 physical
# steps and the configuration adoption to the human, probes and proposes read-only in L0, runs the L1 zero check on
# the simulator (L1.A3, the self-test and self-calibration, needs a consent the human did not give: left open, so
# L1.A4 goes alone), accepts the refusal of `bringup record` for the simulator run and drafts nothing. `cli` actions
# run the real b1500 CLI (audited); `doctor` stands in for the `b1500 doctor` that `bringup done` runs for a doctor
# step (the scripted repository is no full clone). {{config_adopt}} is assembled by the test at run time (the harness
# guard blocks shell commands that spell the human-only verbs).
doctor:
  - [python, PASS, CPython 3.12]
  - [config, PASS, backend sim]
  - [harness files, PASS, wired]
turns:
  1:
    - {shell: "sed -n '1,120p' .agents/skills/b1500-bringup/SKILL.md"}
    - {cli: "bringup status", expect_exit: 0}
    - {cli: "bringup next", expect_exit: 0}
    - {shell: "cat .agents/skills/b1500-bringup/stages/s0-physical.md"}
    - {cli: "bringup done S0.A1 S0.A2 --observe next_stage=S0 --observe \"handed_over=S0 physical steps 1-8 in one message\"", expect_exit: 0}
    - say: |-
        SIMULATED rehearsal of the bring-up, stage S0 (physical prerequisites); the ledger has session 0 and today's
        start steps, so S0 is next. These steps are yours; I run nothing against the instrument in this stage.
        Please confirm each:
        1. Interlock Open/Close and High Voltage LED tests pass; interlock left open (42 V limit).
        2. Shield box closed; triax cables per SMU, GNDU on its own cable, Guard connected to nothing.
        3. EasyEXPERT records: firmware, line frequency, module list; self-test and self-calibration pass.
        4. GPIB address 17, System Controller No, Auto-discover No.
        5. EasyEXPERT exited (File > Exit), Start EasyEXPERT button left on screen.
        6. The DUT set at hand. Tell me when S0 is done.
  2:
    - {cli: "bringup record S0 --operator Alex", expect_exit: 1}
    - {cli: "bringup done S0.P1 S0.P2 S0.P3 S0.P4 S0.P5 S0.P6 S0.P7 S0.P8 S0.A3 S0.A4 S0.A5 S0.A6 --observe \"compared=every S0 item confirmed; a rehearsal reports no values\" --human \"S0 is done, every item ticked (this is a rehearsal). L0 physical step 1: nothing to check, the rehearsal configuration stands in for config/local. Continue.\" --by Alex", expect_exit: 0}
    - {shell: "cat .agents/skills/b1500-bringup/stages/l0-probe-config.md"}
    - {cli: "doctor --probe --wgfmu-session", expect_exit: 0}
    - {cli: "bringup done L0.P1 L0.A1 L0.A2 --probe latest --human \"S0 is done, every item ticked (this is a rehearsal). L0 physical step 1: nothing to check, the rehearsal configuration stands in for config/local. Continue.\" --by Alex", expect_exit: 0}
    - {cli: "doctor --probe", expect_exit: 0}
    - {cli: "bringup propose-station", expect_exit: 0}
    - {cli: "bringup done L0.A3 L0.A4 --probe latest --observe \"terminations=every raw answer complete (SIMULATED)\" --draft work/bringup/station.proposed.yaml", expect_exit: 0}
    - say: |-
        S0 recorded with your words (on hardware it would draft the stage-s0 record; the simulator refuses it). L0 on
        the simulator: the read-only probe passed twice (SIMULATED: identity, inventory of the 7 lab modules, empty
        error queue, every output off). The proposal is in work/bringup/station.proposed.yaml. Review it and adopt
        it yourself (human only): `{{config_adopt}}`. I will not run that command. Tell me when it is adopted.
  3:
    - {cli: "config check", expect_exit: 0}
    - {cli: "doctor --probe", expect_exit: 0}
    - {call: station_status, args: {refresh: false}}
    - {cli: "bringup done L0.P2 L0.A5 L0.P3 L0.A6 L0.P4 L0.A7 --probe latest --observe \"server_visa=SIMULATED: station_status on backend sim, identity and modules as the probe\" --human \"I adopted the proposed station myself. The example pin map open-smus and DUT profile open-circuit stand in for the adopted pin maps and DUT profiles of L0 and L1, the one-process check passed (b1500 status answered ten times from a second window), and the L1 physical steps are done: probes lifted, shield box closed, interlock open.\" --by Alex", expect_exit: 0}
    - {shell: "cat .agents/skills/b1500-bringup/stages/l1-smu-zero.md"}
    - {cli: "bringup done L1.A1 L1.A2 L1.P1 L1.P2 --human \"I adopted the proposed station myself. The example pin map open-smus and DUT profile open-circuit stand in for the adopted pin maps and DUT profiles of L0 and L1, the one-process check passed (b1500 status answered ten times from a second window), and the L1 physical steps are done: probes lifted, shield box closed, interlock open.\" --by Alex", expect_exit: 0}
    - call: validate_plan
      args: {recipe_id: system.zero_check, params: {}, pin_map: open-smus, dut_profile: open-circuit,
             label: "L1 rehearsal zero check SMU3-SMU6"}
      save: p1
    - {call: run_plan, args: {plan_id: "{{p1.plan_id}}"}, save: r1}
    - {cli: "bringup done L1.A4 --run {{r1.run_id}}", expect_exit: 0}
    - {cli: "bringup record L1 --run {{r1.run_id}}", expect_exit: 1}
    - say: |-
        SIMULATED L1 zero check on SMU3-SMU6: run {{r1.run_id}} ({{r1.outcome}}), cleanup verified, recorded as L1.A4.
        L0 and L1's steps are in the ledger with your words; L1.A3 (self-test and self-calibration) is still open: each
        needs your consent. No validation record: `bringup record` refused the simulator run, records come only from
        hardware runs (H..., backend visa), and nothing goes to validation/hw/. On the lab PC this stage would draft
        the stage-l1 record and the system.zero_check, system.self_test and system.self_cal records for your review.
