# Simulator scenario (committed). Schema: b1500_test_agent.models.station.SimScenario; device params are typed by
# b1500_test_agent.models.sim (DEVICE_PARAMS); consumed by the simulator (transport/sim/). Name = file name. The
# slots mirror config/station.example.yaml; `wiring` is the physical wiring of the simulated prober (independent of
# the agent's pin map); `models` holds the truth parameters tests compare extractions against; noise, faults and
# timing as documented in nmos_basic.yaml.
#
# Debug case example-noisy-data (skill b1500-debug, v2.1 plan §3): a correctly landed n-channel MOSFET (the
# nmos_basic device, wired like pin map mosfet-4t) in a shield box that is left open, so the SMU noise floor is raised
# to the level of open_drain_noisy (HRSMU 5 pA, MPSMU 50 pA at medium integration) while every probe is landed. The
# gate has a 10 GOhm leakage path (gate_leak_s 1e-11 S, split between gate-source and gate-drain as in every
# mosfet_ekv), so mosfet.gate_leakage from 0 to 3 V spans 30 pA: with integration short (noise x3, 15 pA) the gate
# current is at its noise floor (SNR below 10), with integration long (x0.3, 1.5 pA) it is clearly resolved (SNR
# above 10): the remedy of a longer integration time (general practice). The floor is a simulator stand-in for an
# open shield box; real pickup is not white noise (50 Hz lines, ground loops: no model here).
# Truth: as nmos_basic (Vth 0.42 V, SS about 77 mV/dec), gate leakage 1e-11 S.

description: >-
  Landed nmos_basic device (mosfet-4t wiring) in an open shield box: raised SMU noise floor (HRSMU 5 pA, MPSMU 50 pA)
  and a 1e-11 S gate leakage, so gate leakage needs a long integration to rise above the noise. Instant timing.
idn: Keysight Technologies,B1500A,SIM0000001,A.06.01.2024.0101
slots:                          # lab layout (config/station.example.yaml): SPGU 1, WGFMU 2, HRSMU 3-4, MPSMU 5-6, MFCMU 7
  - {slot: 1, model: B1525A}
  - {slot: 2, model: B1530A}
  - {slot: 3, model: B1517A}
  - {slot: 4, model: B1517A}
  - {slot: 5, model: B1511B}
  - {slot: 6, model: B1511B}
  - {slot: 7, model: B1520A}
interlock_closed: false
wiring:
  dut:
    gate: 4
    drain: 3
    source: GNDU
    bulk: GNDU
models:
  dut:
    model: mosfet_ekv
    params:
      polarity: n
      vth0: 0.42                # V; the nmos_basic device
      slope_factor: 1.3
      beta: 2.0e-3
      theta: 0.2
      lambda: 0.05
      rs_ohm: 20.0
      gate_leak_s: 1.0e-11      # S; truth of the gate current (I_gate = gate_leak_s x Vg with drain and source at 0 V)
      temperature_k: 300.0
noise:
  floor_a: {MPSMU: 5.0e-11, HRSMU: 5.0e-12}   # open shield box (the level of open_drain_noisy, every probe landed)
  rel: 1.0e-3
  seed: 21
faults: null
timing: instant
