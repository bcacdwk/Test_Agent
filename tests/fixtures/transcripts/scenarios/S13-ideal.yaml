# Ideal agent for S13 (tests/acceptance/scenarios/S13-fecap-pund.yaml). All calls are genuine (fecap.pund and the
# scenario fecap_basic exist since WP10.6, run by the WGFMU closure WP10.8). Turn 1: the card's plan needs confirmation
# (unverified_topology, unverified_pin_map: the RSU wiring and the pin map fecap-wgfmu are unverified), summary shown,
# stop. Turn 2: run_confirmed_plan with the exact summary; pund_polarization gives Pr and Ec, reported as derived with
# the method id and the window next to each value (card fecap-pund section 7).
turns:
  1:
    - {shell: "sed -n '1,80p' .agents/skills/b1500-test/cards/nvm/fecap-pund.md"}
    - {call: station_status, args: {refresh: false}}
    - call: validate_plan
      args: {recipe_id: fecap.pund, params: {}, pin_map: fecap-wgfmu, dut_profile: fecap-generic}
      save: p1
    - say: |-
        SIMULATED. The PUND through the WGFMU needs your confirmation: the RSU wiring and the pin map fecap-wgfmu are
        unverified (R-ROUTE-02 unverified_topology, R-PIN-02 unverified_pin_map). Plan {{p1.plan_id}}:
        ```
        {{p1.summary}}
        ```
        Risks: +-3 V ramps on the top electrode through RSU201 (the WGFMU has no compliance; the 1 mA range bounds
        the reading, not the current); the bottom electrode is held at 0 V through RSU202. Reply to confirm this exact
        plan; nothing runs before.
  2:
    - {call: run_confirmed_plan, args: {plan_id: "{{p1.plan_id}}", summary: "{{p1.summary}}"}, save: r1}
    - {call: analyze_run, args: {run_id: "{{r1.run_id}}", method: pund_polarization}, save: a1}
    - say: |-
        [SIMULATED] Run {{r1.run_id}} ({{r1.outcome}}), confirmed plan {{p1.plan_id}}; status counts {{r1.counts}};
        cleanup verified (WGFMU disconnected, RSUs at rest). Derived values, none measured directly:
        Pr = {{a1.pr}} uC/cm^2 (derived; pund_polarization; window -3..3 V),
        Ps = {{a1.ps}} uC/cm^2 (derived; pund_polarization; window -3..3 V),
        Ec = {{a1.ec}} MV/cm (derived; pund_polarization; window -3..3 V; Vc = {{a1.vc}} V).
        The library was driven only by the server's WGFMU phase.
