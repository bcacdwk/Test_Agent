# Ideal agent for S17 (tests/acceptance/scenarios/S17-bringup-rehearsal.yaml): loads b1500-bringup, reads each stage
# file before acting, hands the S0 and L1 physical steps and the configuration adoption to the human, probes and
# proposes read-only in L0, runs the L1 zero check on the simulator, accepts the refusal of `bringup record` for the
# simulator run and drafts nothing. `cli` actions run the real b1500 CLI (audited). {{config_adopt}} is assembled by
# the test at run time (the harness guard blocks shell commands that spell the human-only verbs).
turns:
  1:
    - {shell: "sed -n '1,120p' .agents/skills/b1500-bringup/SKILL.md"}
    - {cli: "bringup status", expect_exit: 0}
    - {shell: "cat .agents/skills/b1500-bringup/stages/s0-physical.md"}
    - say: |-
        SIMULATED rehearsal of the bring-up, stage S0 (physical prerequisites). These steps are yours; I run nothing
        against the instrument in this stage. Please confirm each:
        1. Interlock Open/Close and High Voltage LED tests pass; interlock left open (42 V limit).
        2. Shield box closed; triax cables per SMU, GNDU on its own cable, Guard connected to nothing.
        3. EasyEXPERT records: firmware, line frequency, module list; self-test and self-calibration pass.
        4. GPIB address 17, System Controller No, Auto-discover No.
        5. EasyEXPERT exited (File > Exit), Start EasyEXPERT button left on screen.
        6. The DUT set at hand. Tell me when S0 is done.
  2:
    - {shell: "cat .agents/skills/b1500-bringup/stages/l0-probe-config.md"}
    - {cli: "doctor --probe", expect_exit: 0}
    - {cli: "bringup propose-station", expect_exit: 0}
    - say: |-
        L0 on the simulator: the read-only probe passed (SIMULATED: identity, inventory of the 7 lab modules, empty
        error queue, every output off). The proposal is in work/bringup/station.proposed.yaml. Review it and adopt
        it yourself (human only): `{{config_adopt}}`. I will not run that command. Tell me when it is adopted.
  3:
    - {cli: "config check", expect_exit: 0}
    - {shell: "cat .agents/skills/b1500-bringup/stages/l1-smu-zero.md"}
    - say: |-
        Configuration valid. Stage L1 (SMU zero), physical steps for you: lift the probes (nothing connected), close
        the shield box, keep the interlock open, and adopt the open-smus pin map and the open-circuit DUT profile.
        Tell me when done.
  4:
    - call: validate_plan
      args: {recipe_id: system.zero_check, params: {}, pin_map: open-smus, dut_profile: open-circuit,
             label: "L1 rehearsal zero check SMU3-SMU6"}
      save: p1
    - {call: run_plan, args: {plan_id: "{{p1.plan_id}}"}, save: r1}
    - {cli: "bringup record L1 --run {{r1.run_id}}", expect_exit: 1}
    - say: |-
        SIMULATED L1 zero check on SMU3-SMU6: run {{r1.run_id}} ({{r1.outcome}}), cleanup verified. No validation
        record: `bringup record` refused the simulator run, records come only from hardware runs (H..., backend visa), and
        nothing goes to validation/hw/. On the lab PC this stage would draft the stage-l1 record and the
        system.zero_check, system.self_test and system.self_cal records for your review.
