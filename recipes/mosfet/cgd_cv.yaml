# Recipe (registry source; schema b1500_test_agent.models.recipe.Recipe; checked by `b1500 dev recipe-check`).
# MOSFET gate-drain capacitance C-V, Cgd (kind cmu_measure, MM 18; card mosfet-split-cv; blueprint v2 3.2, implements
# the reserved id mosfet.cgd_cv; bring-up stage L6): gate on the MFCMU High side (DC bias sweep, Cp-G), drain on the
# Low side, source and bulk grounded (an SMU at 0 V or the GNDU: AC ground), so only the drain half of the channel
# and the drain overlap are measured: Cgd = Cov in accumulation, about Cox*W*L/2 + Cov in strong inversion at low
# frequency. Same landing as mosfet.cgc_cv (pin map mosfet-split-cv: source on SMU6, switched on at 0 V here). With
# an SCUU the gate and drain reach the MFCMU through SCUU1.OUT1/OUT2 (same landing as the I-V). Needs fresh
# phase/open/short corrections of this pin map at every frequency (R-CORR-01). Programming Guide Ed. 15: C-V sweep
# (PDF 256-260), MM 18 (PDF 470-471), DV (PDF 396).
# status: sim_validated by tests/integration/test_recipes_cv.py (nmos_cv: plateau and Vth vs the model truth); the
# visa path by tests/visa_loop/test_cv_visa.py; hw_validated only through a reviewed validation record (stage L6).
id: mosfet.cgd_cv
version: 1
title: MOSFET gate-drain capacitance C-V (Cgd; source and bulk AC-grounded)
family: cmu
kind: cmu_measure
status: sim_validated
card: .agents/skills/b1500-test/cards/cmu/mosfet-split-cv.md
device_types: [nmos, pmos]
roles:
  gate:
    function: cmu_high
    module_types: [MFCMU]
    settings: {freqs: $freqs_hz, ac: $ac_vrms, start: $vg_start, stop: $vg_stop, points: $points, mode: $sweep_mode,
               hold: $hold_s, delay: $delay_s, model: cp_g}
  drain: {function: cmu_low, module_types: [MFCMU]}
  source: {function: ground, allow_gndu: true, settings: {icomp: $icomp_source}}
  bulk: {function: ground, allow_gndu: true}
params:
  freqs_hz:
    type: float_list
    unit: Hz
    default: [1.0e+5]
    range: [1.0e+3, 5.0e+6]
    doc: Measurement frequencies, one sweep each (in the correction list).
  ac_vrms: {unit: V, default: 0.03, recommended: [0.01, 0.05], range: [0.01, 0.25], doc: Oscillator level (V rms).}
  vg_start: {unit: V, default: -1.5, recommended: [-3.0, 0.0], range: [-25.0, 25.0], doc: Gate DC bias start (accumulation).}
  vg_stop: {unit: V, default: 2.5, recommended: [1.0, 3.0], range: [-25.0, 25.0], doc: Gate DC bias stop (strong inversion).}
  points: {type: int, default: 81, recommended: [41, 201], range: [11, 1001], doc: Bias steps per sweep direction.}
  sweep_mode: {type: enum, choices: [single, double], default: single, doc: single start->stop; double start->stop->start.}
  hold_s: {unit: s, default: 0.5, recommended: [0.0, 2.0], range: [0.0, 60.0], doc: Hold at vg_start before the first step.}
  delay_s: {unit: s, default: 0.0, recommended: [0.0, 0.1], range: [0.0, 10.0], doc: Delay per step before the measurement.}
  icomp_source: {unit: A, default: 1.0e-3, recommended: [1.0e-6, 1.0e-3], range: [1.0e-9, 1.0e-2], doc: Compliance of the source SMU at 0 V.}
  integration:
    type: enum
    choices: [short, medium, long]
    default: medium
    doc: MFCMU averaging (short ACT 0,1; medium ACT 0,2 = initial; long ACT 2,2 = two power-line cycles).
quality: {limited: [], untrusted: [U, D, V, X, C, T, F, G, S], max_limited_fraction_in_fit: 0.05}
analysis_defaults:
  - {method: cv_vth, options: {}}
provenance:
  sources:
    - blueprint v2 2.7 (kind cmu_measure), 3.2 (mosfet.cgd_cv); v0.2 references/recipes/mosfet/cgd_cv.example.yaml
    - Programming Guide Ed. 15 C-V sweep (PDF 256-260), MM 18 (PDF 470-471), DV (PDF 396)
  validation_runs: []
